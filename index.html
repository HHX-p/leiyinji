<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>雷樱纪 · 影向山</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0d0c11;
    overflow: hidden;
    font-family: "Microsoft YaHei", sans-serif;
  }
  #wrap {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas#game {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    visibility: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
  }
  /* ---- 触屏按钮：只在触屏设备上显示 ---- */
  #touch { display: none; }
  @media (pointer: coarse), (max-width: 900px) {
    #touch {
      display: block;
      position: fixed; inset: 0;
      pointer-events: none;
      user-select: none; -webkit-user-select: none;
      touch-action: none;
    }
    #touch .pad, #touch .acts { position: absolute; bottom: 14px; pointer-events: auto; }
    #touch .pad { left: 14px; width: 150px; height: 150px; }
    #touch .acts { right: 14px; display: flex; flex-direction: column; gap: 10px; }
    #touch button {
      position: absolute;
      width: 50px; height: 50px;
      border-radius: 12px;
      border: 1px solid rgba(240,215,154,0.45);
      background: rgba(20,18,26,0.55);
      color: #f0d79a;
      font-size: 17px;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    #touch button.on { background: rgba(240,215,154,0.32); }
    #touch .u { left: 50px; top: 0; }
    #touch .d { left: 50px; top: 100px; }
    #touch .l { left: 0; top: 50px; }
    #touch .r { left: 100px; top: 50px; }
    #touch .subacts {
      display: none;
      position: absolute;
      right: 92px; bottom: 14px;
      grid-template-columns: repeat(2, 66px);
      gap: 8px;
      pointer-events: auto;
    }
    #touch.menuopen .subacts { display: grid; }
    #touch .subacts button {
      position: static;
      width: 66px; height: 44px;
      border-radius: 10px;
      font-size: 13px;
      background: rgba(20,18,26,0.8);
    }
    #touch.inbattle .subacts, #touch.indialogue .subacts { display: none !important; }
    #touch .only-save { display: none; }
    #touch.insave .only-save { display: block; }
    #touch.inbattle .pad, #touch.indialogue .pad { display: none; }
    #touch.indialogue .acts {
      flex-direction: row;
      top: 10px; bottom: auto; right: 10px;
    }
    #touch.indialogue .acts button { width: 52px; height: 52px; font-size: 13px; opacity: 0.88; }
    #touch.inbattle .acts {
      flex-direction: row;
      top: 10px; bottom: auto; right: 10px;
    }
    #touch.inbattle .acts button { width: 52px; height: 52px; font-size: 13px; opacity: 0.85; }
    #touch .acts button { position: static; width: 62px; height: 62px; border-radius: 50%; font-size: 15px; }
  }
  /* 竖屏提示：这个游戏只有横屏 */
  #rotate {
    display: none;
    position: fixed; inset: 0;
    background: #0d0c11;
    color: #c9b98f;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 14px;
    font-size: 15px; letter-spacing: .2em;
    z-index: 20;
  }
  #rotate .icon {
    width: 54px; height: 84px;
    border: 2px solid rgba(201,185,143,0.7);
    border-radius: 8px;
    animation: rot 2s ease-in-out infinite;
  }
  @keyframes rot {
    0%, 40% { transform: rotate(0deg); }
    60%, 100% { transform: rotate(90deg); }
  }
  @media (orientation: portrait) and (max-width: 900px) {
    #rotate { display: flex; }
  }
  #loading { flex-direction: column; gap: 14px; }
  #loading .ld-title { color: #c9b98f; font-size: 14px; letter-spacing: .3em; }
  #loading .ld-bar {
    width: 180px; height: 3px; border-radius: 2px;
    background: rgba(201,185,143,0.18); overflow: hidden;
  }
  #loading .ld-bar > i {
    display: block; height: 100%; width: 0%;
    background: #c9b98f;
    transition: width .18s ease-out;
  }
  #loading .ld-status { color: rgba(201,185,143,0.6); font-size: 12px; letter-spacing: .12em; }
  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #c9b98f; font-size: 14px; letter-spacing: .3em;
    background: #0d0c11;
  }
</style>
</head>
<body>
  <div id="wrap"><canvas id="game"></canvas></div>
  <div id="touch">
    <div class="pad">
      <button class="u" data-key="up">↑</button>
      <button class="l" data-key="left">←</button>
      <button class="r" data-key="right">→</button>
      <button class="d" data-key="down">↓</button>
    </div>
    <div class="acts">
      <button data-key="action">确认</button>
      <button data-key="cancel">返回</button>
      <button data-key="questlog">任务</button>
      <button class="only-save" data-key="loadslot">读取</button>
      <button id="touch-menu" type="button">菜单</button>
    </div>
    <div class="subacts" id="touch-sub">
      <button data-key="inventory">背包</button>
      <button data-key="gear">装备</button>
      <button data-key="partypanel">队伍</button>
      <button data-key="savepanel">存档</button>
      <button data-key="achpanel">成就</button>
      <button data-key="minimap">小地图</button>
      <button data-key="bigmap">大地图</button>
      <button data-key="outfit">换装</button>
      <button data-key="mute">静音</button>
    </div>
  </div>

  <div id="rotate">
    <div class="icon"></div>
    <div>请把手机横过来</div>
  </div>

  <div id="loading">
    <div class="ld-title">雪 ノ 下 ニ 参 道</div>
    <div class="ld-bar"><i id="ld-fill"></i></div>
    <div class="ld-status" id="ld-status">正在载入…</div>
  </div>

  <script>
/**
 * data.js —— 基础常量（图块 id、碰撞、物件类型）
 * 地图内容在 maps.js。
 */
(function () {
  'use strict';
  const G = (window.G = window.G || {});

  G.TILE = {
    GRASS: 0, GRASS_FLOWER: 1, GRASS_DARK: 2,
    PATH: 3, PATH_CRACK: 4, PATH_L: 5, PATH_R: 6,
    WATER: 7, WATER_B: 8, DIRT: 9, CLIFF: 10,
    BUSH: 11, ROCK: 12, FLOWERBED: 13, SAND: 14, VOID: 15,
  };

  G.SOLID = new Set([
    G.TILE.WATER, G.TILE.WATER_B, G.TILE.CLIFF, G.TILE.BUSH, G.TILE.ROCK, G.TILE.VOID,
  ]);

  G.OBJ = { TREE_A: 0, TREE_B: 1, TREE_C: 2, ROCK: 3, LANTERN: 4, SIGN: 5 };

  G.MAP_W = 48;
  G.MAP_H = 36;
  G.TILE_SIZE = 16;
  G.currentMap = 'path';

  // 地图级容器，由 loadMap 填充
  G.OBJECTS = [];
  G.NPCS = [];
  G.ENCOUNTERS = [];
  G.PICKUPS = [];
  G.PORTALS = [];
  G.STRUCTS = [];
})();

</script>
  <script>
/**
 * engine.js —— 画布、输入、相机、资源加载
 */
(function () {
  'use strict';
  const G = (window.G = window.G || {});

  G.VIEW_W = 480;
  G.VIEW_H = 270;

  G.canvas = null;
  G.ctx = null;

  G.initCanvas = function (canvas) {
    // 判断是不是触屏设备：粗指针，或者窗口窄得像手机
    try {
      G.isTouch = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
        window.innerWidth <= 900;
    } catch (e) {
      G.isTouch = window.innerWidth <= 900;
    }
    G.canvas = canvas;
    canvas.width = G.VIEW_W;
    canvas.height = G.VIEW_H;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    G.ctx = ctx;
    G.resize();
    window.addEventListener('resize', G.resize);
  };

  // 优先整数倍放大（像素最干净）；屏幕上连 2 倍都放不下时退而用分数倍，别留大片黑边
  G.resize = function () {
    if (!G.canvas) return;
    const fit = Math.min(window.innerWidth / G.VIEW_W, window.innerHeight / G.VIEW_H);
    let s;
    if (fit >= 2) {
      s = Math.floor(fit);
    } else {
      s = Math.max(0.5, Math.floor(fit * 100) / 100);
    }
    G.canvas.style.width = Math.round(G.VIEW_W * s) + 'px';
    G.canvas.style.height = Math.round(G.VIEW_H * s) + 'px';
    G.scale = s;
  };

  // ---------- 输入 ----------
  G.keys = Object.create(null);
  G.pressed = Object.create(null); // 本帧新按下

  G.bindInput = function () {
    const map = {
      ArrowUp: 'up', KeyW: 'up',
      ArrowDown: 'down', KeyS: 'down',
      ArrowLeft: 'left', KeyA: 'left',
      ArrowRight: 'right', KeyD: 'right',
      Space: 'action', Enter: 'action', KeyE: 'action', KeyJ: 'action',
      Escape: 'cancel',
      KeyI: 'inventory',
      KeyG: 'gear',
      KeyO: 'savepanel',
      KeyP: 'partypanel',
      KeyQ: 'questlog',
      KeyN: 'minimap',
      KeyT: 'achpanel',
      KeyC: 'outfit',
      KeyB: 'bigmap',
      KeyF: 'perf',
      KeyL: 'loadslot',
      KeyM: 'mute',
    };
    window.addEventListener('keydown', (e) => {
      if (G.sfx) G.sfx.init();
      const k = map[e.code];
      if (!k) return;
      e.preventDefault();
      if (!G.keys[k]) G.pressed[k] = true;
      G.keys[k] = true;
    });
    window.addEventListener('keyup', (e) => {
      const k = map[e.code];
      if (!k) return;
      e.preventDefault();
      G.keys[k] = false;
    });
    window.addEventListener('blur', () => {
      for (const k in G.keys) G.keys[k] = false;
    });
  };

  /** 触屏：把 DOM 按钮映射到同一套 keys/pressed */
  G.bindTouch = function () {
    const wrap = document.getElementById('touch');
    if (!wrap) return;
    const bind = (el, key) => {
      const down = (e) => {
        e.preventDefault();
        if (G.sfx) G.sfx.init();
        if (!G.keys[key]) G.pressed[key] = true;
        G.keys[key] = true;
        el.classList.add('on');
      };
      const up = (e) => {
        e.preventDefault();
        G.keys[key] = false;
        el.classList.remove('on');
      };
      el.addEventListener('touchstart', down, { passive: false });
      el.addEventListener('touchend', up, { passive: false });
      el.addEventListener('touchcancel', up, { passive: false });
      el.addEventListener('mousedown', down);
      el.addEventListener('mouseup', up);
      el.addEventListener('mouseleave', up);
    };
    const menuBtn = document.getElementById('touch-menu');
    if (menuBtn) {
      const toggle = (e) => {
        e.preventDefault();
        wrap.classList.toggle('menuopen');
        if (G.sfx) G.sfx.play('move');
      };
      menuBtn.addEventListener('touchstart', toggle, { passive: false });
      menuBtn.addEventListener('mousedown', toggle);
    }
    for (const el of wrap.querySelectorAll('[data-key]')) {
      bind(el, el.dataset.key);
    }
  };

  // 每帧末清掉「刚按下」
  G.endFrame = function () {
    for (const k in G.pressed) G.pressed[k] = false;
  };

  // ---------- 按住连发（只给方向键用，避免空格误触） ----------
  G.held = Object.create(null);
  G.repeatT = Object.create(null);
  const REPEAT_DELAY = 0.32;
  const REPEAT_RATE = 0.085;
  const REPEATABLE = { up: 1, down: 1, left: 1, right: 1 };

  // 触屏点击转按键：排队到下一帧开头生效
  G.tapQueue = [];
  G.queueKey = function (k) { G.tapQueue.push(k); };

  G.updateInput = function (dt) {
    if (G.tapQueue.length) {
      for (const k of G.tapQueue) G.pressed[k] = true;
      G.tapQueue.length = 0;
    }
    for (const k in REPEATABLE) {
      if (!G.keys[k]) {
        G.held[k] = 0;
        G.repeatT[k] = 0;
        continue;
      }
      const before = G.held[k] || 0;
      G.held[k] = before + dt;
      if (before < REPEAT_DELAY && G.held[k] >= REPEAT_DELAY) G.repeatT[k] = 0;
      if (G.held[k] >= REPEAT_DELAY) {
        G.repeatT[k] = (G.repeatT[k] || 0) + dt;
        if (G.repeatT[k] >= REPEAT_RATE) {
          G.repeatT[k] = 0;
          G.pressed[k] = true;
        }
      }
    }
  };

  // ---------- 帧率统计 ----------
  G.perf = { on: false, fps: 0, acc: 0, n: 0, max: 0, prev: 0, med: 0, worst: 0, hitch: 0, mem: 0, samples: [] };

  // ---------- 资源 ----------
  G.assets = { portraits: {} };

  G.loadImage = function (src) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null); // 缺图不阻塞启动
      img.src = src;
    });
  };

  G.loadAll = async function () {
    const base = 'assets/';
    const total = 14;
    let done = 0;
    const tick = (name) => {
      done++;
      if (typeof G.onLoadProgress === 'function') {
        try { G.onLoadProgress(done, total, name); } catch (e) {}
      }
    };
    const [tiles, chars, objects] = await Promise.all([
      G.loadImage(base + 'tiles.png'),
      G.loadImage(base + 'chars.png'),
      G.loadImage(base + 'objects.png'),
    ]);
    G.assets.tiles = tiles;
    G.assets.chars = chars;
    G.assets.objects = objects;
    tick('图集'); tick('图集'); tick('图集');

    const names = ['ei', 'miko', 'makoto', 'saiguu', 'chiyo', 'sasayuri',
      'sara', 'ayaka', 'ayato', 'kazuha', 'lumine',
      'asagi', 'ayaka_worry'];
    await Promise.all(names.map(async (n) => {
      G.assets.portraits[n] = await G.loadImage(base + 'portraits/' + n + '.webp');
      tick(n);
    }));
  };

  // ---------- 相机（带平滑，实际绘制用取整后的坐标） ----------
  G.camera = { x: 0, y: 0, fx: 0, fy: 0 };

  function cameraTarget(tx, ty) {
    const W = G.MAP_W * G.TILE_SIZE;
    const H = G.MAP_H * G.TILE_SIZE;
    let cx = tx - G.VIEW_W / 2;
    let cy = ty - G.VIEW_H / 2;
    cx = Math.max(0, Math.min(cx, Math.max(0, W - G.VIEW_W)));
    cy = Math.max(0, Math.min(cy, Math.max(0, H - G.VIEW_H)));
    return { x: cx, y: cy };
  }

  /** 不带 dt = 直接吸附（切地图时用） */
  G.updateCamera = function (tx, ty, dt) {
    const t = cameraTarget(tx, ty);
    if (dt === undefined || dt === null) {
      G.camera.fx = t.x;
      G.camera.fy = t.y;
    } else {
      // 指数平滑：帧率无关，约 0.12 秒追上一半
      const k = 1 - Math.exp(-9 * dt);
      G.camera.fx += (t.x - G.camera.fx) * k;
      G.camera.fy += (t.y - G.camera.fy) * k;
      // 追上后避免无限逼近
      if (Math.abs(t.x - G.camera.fx) < 0.4) G.camera.fx = t.x;
      if (Math.abs(t.y - G.camera.fy) < 0.4) G.camera.fy = t.y;
    }
    G.camera.x = Math.round(G.camera.fx);
    G.camera.y = Math.round(G.camera.fy);
  };

  // ---------- 绘图小工具 ----------
  /** 位置哈希：同一格永远得到同一个 0~1 值，用来放固定的地面装饰。
   *  用 Math.imul 保证 32 位精确，和 Python 离线渲染的结果一致。 */
  G.hash2 = function (x, y) {
    let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967295;
  };

  G.roundRect = function (ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  };
})();

</script>

  <script>
/**
 * audio.js —— 用 WebAudio 现场合成音效，不需要任何音频文件。
 * 浏览器要求先有用户操作，所以在第一次按键时才创建 AudioContext。
 */
(function () {
  'use strict';
  const G = (window.G = window.G || {});

  let ctx = null;
  let muted = false;

  function ensure() {
    if (ctx) {
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    } catch (e) {
      ctx = null;
    }
    return ctx;
  }

  /** 单个音符：type 波形，f0→f1 滑音，dur 秒 */
  function tone(f0, f1, dur, type, vol, delay) {
    const c = ensure();
    if (!c || muted) return;
    const t0 = c.currentTime + (delay || 0);
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(f0, t0);
    if (f1 && f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.06, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    g.connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  function noise(dur, vol) {
    const c = ensure();
    if (!c || muted) return;
    const n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource();
    const g = c.createGain();
    src.buffer = buf;
    g.gain.value = vol || 0.05;
    src.connect(g);
    g.connect(c.destination);
    src.start();
  }

  const SFX = {
    blip: () => tone(660, 660, 0.035, 'square', 0.03),
    move: () => tone(440, 440, 0.04, 'square', 0.035),
    confirm: () => { tone(660, 880, 0.07, 'square', 0.05); },
    cancel: () => tone(440, 300, 0.08, 'square', 0.04),
    hit: () => { noise(0.08, 0.05); tone(220, 110, 0.09, 'square', 0.05); },
    react: () => { tone(880, 1320, 0.12, 'triangle', 0.06); tone(1320, 1760, 0.10, 'triangle', 0.04, 0.06); },
    heal: () => { tone(523, 784, 0.12, 'sine', 0.06); tone(784, 1046, 0.10, 'sine', 0.05, 0.08); },
    win: () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.13, 'square', 0.05, i * 0.09)); },
    levelup: () => { [659, 880, 1046, 1318].forEach((f, i) => tone(f, f, 0.10, 'triangle', 0.05, i * 0.07)); },
    portal: () => { tone(300, 900, 0.25, 'sine', 0.05); },
    pickup: () => { tone(880, 1320, 0.07, 'square', 0.05); },
  };

  // ---------- 环境音乐 ----------
  // 每个地区一个根音；和声只放根音 + 五度 + 八度，避免跑调
  const MOODS = {
    path: 110.00,    // 参道
    shrine: 98.00,   // 大社
    town: 123.47,    // 町街
    depths: 82.41,   // 奥宫
  };

  let musicNodes = null;
  let musicGain = null;
  let currentMood = null;

  function buildMusic() {
    const c = ensure();
    if (!c || musicNodes) return;
    musicGain = c.createGain();
    musicGain.gain.value = 0; // 淡入
    const lp = c.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 420;
    lp.Q.value = 0.6;
    musicGain.connect(lp);
    lp.connect(c.destination);

    musicNodes = [];
    // 三层：根音、五度、八度，微微失谐制造厚度
    const detunes = [0, 1.5, -1.2];
    for (let i = 0; i < 3; i++) {
      const o = c.createOscillator();
      o.type = i === 2 ? 'triangle' : 'sine';
      o.frequency.value = 110 * (i === 1 ? 1.5 : i === 2 ? 2 : 1);
      o.detune.value = detunes[i];
      const g = c.createGain();
      g.gain.value = i === 2 ? 0.10 : 0.22;
      o.connect(g);
      g.connect(musicGain);
      o.start();
      musicNodes.push({ osc: o, gain: g });
    }
    // 缓慢浮动的滤波，让长音有呼吸感
    const lfo = c.createOscillator();
    lfo.frequency.value = 0.045;
    const lfoGain = c.createGain();
    lfoGain.gain.value = 180;
    lfo.connect(lfoGain);
    lfoGain.connect(lp.frequency);
    lfo.start();

    musicGain.gain.linearRampToValueAtTime(0.05, c.currentTime + 3);
  }

  G.music = {
    /** 切到某个地区的调子 */
    setMood(name) {
      const c = ensure();
      if (!c) return;
      if (!musicNodes) buildMusic();
      if (!musicNodes) return;
      const root = MOODS[name] || MOODS.path;
      if (currentMood === root) return;
      currentMood = root;
      const ratios = [1, 1.5, 2];
      const now = c.currentTime;
      musicNodes.forEach((n, i) => {
        try {
          n.osc.frequency.cancelScheduledValues(now);
          n.osc.frequency.setTargetAtTime(root * ratios[i], now, 1.8);
        } catch (e) { /* 忽略 */ }
      });
    },
    setMuted(m) {
      const c = ensure();
      if (!c || !musicGain) return;
      musicGain.gain.setTargetAtTime(m ? 0 : 0.05, c.currentTime, 0.4);
    },
  };

  G.sfx = {
    play(name) {
      const f = SFX[name];
      if (f) { try { f(); } catch (e) {} }
    },
    toggle() {
      muted = !muted;
      if (G.music) G.music.setMuted(muted);
      return muted;
    },
    get muted() { return muted; },
    init() { ensure(); },
  };
})();

    G.gear.equip[charId] = list[i];

/**
 * env.js —— 昼夜与天气
 * 一天 = 240 秒。天气每 45~90 秒随机切换一次。
 */
(function () {
  'use strict';
  const G = (window.G = window.G || {});

  const DAY_LENGTH = 240;   // 秒

  G.env = {
    t: 0.30,          // 0 = 午夜，0.25 = 清晨，0.5 = 正午，0.75 = 黄昏
    weather: 'clear',
    weatherT: 60,
    drops: [],
    enabled: true,
  };

  const WEATHERS = ['clear', 'clear', 'clear', 'rain', 'snow'];

  G.envName = function () {
    const t = G.env.t;
    if (t < 0.2 || t >= 0.85) return '夜';
    if (t < 0.3) return '晨';
    if (t < 0.65) return '昼';
    if (t < 0.78) return '夕';
    return '暮';
  };

  G.weatherName = function () {
    return { clear: '晴', rain: '雨', snow: '雪' }[G.env.weather] || '';
  };

  /** 环境叠色：返回 {r,g,b,a} 或 null */
  G.envTint = function () {
    const t = G.env.t;
    let col = null;
    if (t < 0.22 || t >= 0.84) {
      // 夜：深蓝
      const k = t < 0.22 ? 1 - t / 0.22 : (t - 0.84) / 0.16;
      col = { r: 14, g: 20, b: 52, a: 0.26 + 0.16 * k };
    } else if (t < 0.33) {
      // 晨：淡金
      const k = 1 - (t - 0.22) / 0.11;
      col = { r: 255, g: 176, b: 120, a: 0.12 * k };
    } else if (t > 0.68 && t < 0.84) {
      // 夕：橙红
      const k = (t - 0.68) / 0.16;
      col = { r: 240, g: 130, b: 80, a: 0.08 + 0.18 * k };
    }
    return col;
  };

  function resetDrops() {
    const w = G.VIEW_W, h = G.VIEW_H;
    const n = G.env.weather === 'rain' ? 120 : G.env.weather === 'snow' ? 70 : 0;
    G.env.drops = [];
    for (let i = 0; i < n; i++) {
      G.env.drops.push({
        x: Math.random() * w,
        y: Math.random() * h,
        v: G.env.weather === 'rain' ? 260 + Math.random() * 120 : 18 + Math.random() * 22,
        len: G.env.weather === 'rain' ? 6 + Math.random() * 6 : 0,
        ph: Math.random() * Math.PI * 2,
      });
    }
  }

  G.resetDrops = resetDrops;

  G.updateEnv = function (dt) {
    if (!G.env.enabled) return;

    // 通关后：世界停在黄昏，永远晴
    if (G.postGame && G.postGame()) {
      G.env.t = 0.70;
      G.env.weather = 'clear';
      if (!G.env.petals || !G.env.petals.length) {
        G.env.petals = [];
        for (let i = 0; i < 36; i++) {
          G.env.petals.push({
            x: Math.random() * G.VIEW_W,
            y: Math.random() * G.VIEW_H,
            vy: 10 + Math.random() * 16,
            ph: Math.random() * 6.28,
          });
        }
      }
      for (const p of G.env.petals) {
        p.y += p.vy * dt;
        p.x += Math.sin(p.ph + G.env.t * 6) * 12 * dt;
        if (p.y > G.VIEW_H + 3) { p.y = -3; p.x = Math.random() * G.VIEW_W; }
      }
      return;
    }

    G.env.t = (G.env.t + dt / DAY_LENGTH) % 1;

    G.env.weatherT -= dt;
    if (G.env.weatherT <= 0) {
      const next = WEATHERS[Math.floor(Math.random() * WEATHERS.length)];
      if (next !== G.env.weather) {
        G.env.weather = next;
        resetDrops();
      }
      G.env.weatherT = 45 + Math.random() * 45;
    }

    const drops = G.env.drops;
    for (const d of drops) {
      d.y += d.v * dt;
      if (G.env.weather === 'snow') {
        d.ph += dt * 2;
        d.x += Math.sin(d.ph) * 10 * dt;
      } else {
        d.x += 40 * dt;
      }
      if (d.y > G.VIEW_H) { d.y = -8; d.x = Math.random() * G.VIEW_W; }
      if (d.x > G.VIEW_W) d.x = 0;
    }
  };

  /** 画在世界之上、HUD 之下 */
  G.drawEnv = function (ctx) {
    if (!G.env.enabled) return;
    const tint = G.envTint();
    if (tint) {
      ctx.fillStyle = `rgba(${tint.r},${tint.g},${tint.b},${tint.a})`;
      ctx.fillRect(0, 0, G.VIEW_W, G.VIEW_H);
    }
    if (G.env.weather === 'rain') {
      // 雨天整体压暗一点，先把气氛压出来
      ctx.fillStyle = 'rgba(30,44,70,0.16)';
      ctx.fillRect(0, 0, G.VIEW_W, G.VIEW_H);

      ctx.strokeStyle = 'rgba(186,212,240,0.62)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (const d of G.env.drops) {
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - 3, d.y + d.len + 3);
      }
      ctx.stroke();

      // 地面溅点：底部一小段
      ctx.fillStyle = 'rgba(200,220,245,0.30)';
      for (const d of G.env.drops) {
        const gy = Math.round(d.y + d.len + 4);
        if (gy > G.VIEW_H - 6) {
          ctx.fillRect(Math.round(d.x) - 1, gy, 3, 1);
        }
      }
    } else if (G.env.weather === 'snow') {
      // 雪天提亮
      ctx.fillStyle = 'rgba(210,222,245,0.10)';
      ctx.fillRect(0, 0, G.VIEW_W, G.VIEW_H);

      for (const d of G.env.drops) {
        const s = d.len > 0 ? 1 : 2;
        ctx.fillStyle = d.v > 30 ? 'rgba(248,251,255,0.9)' : 'rgba(232,240,255,0.65)';
        ctx.fillRect(Math.round(d.x), Math.round(d.y), s, s);
      }
    }

    // 后日谈：落樱不停
    if (G.postGame && G.postGame() && G.env.petals) {
      ctx.fillStyle = 'rgba(244,186,210,0.7)';
      for (const p of G.env.petals) {
        ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 1);
      }
    }
  };

  /** 右上角的时辰显示 */
  G.drawClock = function (ctx) {
    if (!G.env.enabled) return;
    const txt = `${G.envName()} ${G.weatherName()}`;
    ctx.font = '12px "Microsoft YaHei", sans-serif';
    const w = ctx.measureText(txt).width + 18;
    const x = G.VIEW_W - w - 8;
    ctx.fillStyle = 'rgba(18,16,22,0.78)';
    G.roundRect(ctx, x, 6, w, 22, 4);
    ctx.fill();
    ctx.fillStyle = '#f0d79a';
    ctx.fillText(txt, x + 9, 21);
  };
})();

  <script>
/**
 * save.js —— 存档（localStorage，三个槽位）
 * 只存进度：队伍等级经验、已击败的野怪、玩家位置、旗标、道具、装备。
 */
(function () {
  'use strict';
  const G = (window.G = window.G || {});

  // 有些手机浏览器禁用 localStorage，直接访问会抛异常，
  // 一抛就把整个启动流程打断（表现为永远卡在加载页）。这里做内存兜底。
  const memStore = Object.create(null);
  let LS = null;
  try { LS = window.localStorage; } catch (e) { LS = null; }
  if (!LS) { try { LS = localStorage; } catch (e) { LS = null; } }

  const store = {
    get(k) {
      if (LS) { try { return LS.getItem(k); } catch (e) { /* 落回内存 */ } }
      return memStore[k] === undefined ? null : memStore[k];
    },
    set(k, v) {
      if (LS) { try { LS.setItem(k, v); return; } catch (e) { /* 落回内存 */ } }
      memStore[k] = v;
    },
    remove(k) {
      if (LS) { try { LS.removeItem(k); } catch (e) { /* 落回内存 */ } }
      delete memStore[k];
    },
  };
  const PREFIX = 'leiyinji.save.';
  const SLOTS = 3;

  G.SLOT_COUNT = SLOTS;
  G.currentSlot = 0;

  function emptyProgress() {
    return {
      party: {}, encounters: {}, player: null, battles: 0, outfit: {},
      flags: {}, inv: {}, pickups: {}, mapKey: 'path',
      gear: null, mora: 0, stamp: 0,
    };
  }

  G.progress = emptyProgress();

  function key(i) { return PREFIX + i; }

  G.save = {
    exists(i) {
      try { return !!store.get(key(i === undefined ? G.currentSlot : i)); }
      catch (e) { return false; }
    },

    /** 读取槽位 i（默认当前槽）；成功返回 true */
    load(i) {
      const idx = i === undefined ? G.currentSlot : i;
      try {
        const s = store.get(key(idx));
        if (!s) return false;
        const d = JSON.parse(s);
        G.progress = {
          party: d.party || {},
    outfit: d.outfit || {},
    __restoreOutfit: true,
          encounters: d.encounters || {},
          player: d.player || null,
          battles: d.battles || 0,
          flags: d.flags || {},
          inv: d.inv || {},
          pickups: d.pickups || {},
          mapKey: d.mapKey || 'path',
          gear: d.gear || null,
          mora: d.mora || 0,
          stamp: d.stamp || 0,
          ach: d.ach || {},
          seen_ending: !!d.seen_ending,
          catTalks: d.catTalks || 0,
          hp: d.hp || {},            // 血量跨战斗保留，读档也要带上
          formation: d.formation || null,   // 队伍编成
          talk: d.talk || {},               // 每个 NPC 聊到第几段
          seen_tutorial: !!d.seen_tutorial,
        };
        G.currentSlot = idx;
        return true;
      } catch (e) {
        return false;
      }
    },

    write(i) {
      const idx = i === undefined ? G.currentSlot : i;
      try {
        G.progress.stamp = Date.now();
        if (G.outfit) G.progress.outfit = G.outfit;
        store.set(key(idx), JSON.stringify(G.progress));
        G.currentSlot = idx;
      } catch (e) { /* 隐私模式或超限，静默失败 */ }
    },

    reset(i) {
      const idx = i === undefined ? G.currentSlot : i;
      try { store.remove(key(idx)); } catch (e) {}
    },

    /** 三个槽位的摘要，用于存档面板 */
    slots() {
      const out = [];
      for (let i = 0; i < SLOTS; i++) {
        let d = null;
        try {
          const s = store.get(key(i));
          if (s) d = JSON.parse(s);
        } catch (e) { d = null; }
        out.push({
          i,
          exists: !!d,
          battles: d ? d.battles || 0 : 0,
          mapKey: d ? d.mapKey || '' : '',
          stamp: d ? d.stamp || 0 : 0,
          ch1: !!(d && d.flags && d.flags.chapter1_done),
          ch2: !!(d && d.flags && d.flags.chapter2_done),
          mora: d ? d.mora || 0 : 0,
        });
      }
      return out;
    },

    /** 取某个角色的等级与经验，没有就用 1 级 */
    of(id) {
      return G.progress.party[id] || { lv: 1, exp: 0 };
    },

    gainExp(id, amount) {
      const p = G.progress.party[id] || { lv: 1, exp: 0 };
      p.exp += amount;
      let levels = 0;
      while (p.exp >= G.EXP_TABLE(p.lv) && p.lv < 60) {
        p.exp -= G.EXP_TABLE(p.lv);
        p.lv += 1;
        levels += 1;
      }
      G.progress.party[id] = p;
      return { lv: p.lv, exp: p.exp, levels };
    },

    addMora(n) {
      G.progress.mora = (G.progress.mora || 0) + n;
    },
  };
})();

  <script>
/**
 * world.js —— 地图绘制、碰撞查询、建筑
 */
(function () {
  'use strict';
  const G = (window.G = window.G || {});

  G.world = {
    map: null,
    w: G.MAP_W,
    h: G.MAP_H,
    tile: G.TILE_SIZE,
    torii: null,
  };

  G.initWorld = function () {
    const w = G.world;
    w.map = new Uint8Array(1);
    w.w = 1;
    w.h = 1;
    w.structs = [];
  };

  G.tileAt = function (tx, ty) {
    const w = G.world;
    if (tx < 0 || ty < 0 || tx >= w.w || ty >= w.h) return G.TILE.CLIFF;
    return w.map[ty * w.w + tx];
  };

  G.isSolidTile = function (tx, ty) {
    return G.SOLID.has(G.tileAt(tx, ty));
  };

  /** 圆形碰撞盒（脚底）与图块、鸟居柱子的碰撞 */
  G.isBlocked = function (px, py, r) {
    const t = G.TILE_SIZE;
    const pts = [
      [px - r, py - r], [px + r, py - r],
      [px - r, py + r], [px + r, py + r],
      [px, py],
    ];
    for (const [x, y] of pts) {
      if (G.isSolidTile(Math.floor(x / t), Math.floor(y / t))) return true;
    }
    // 建筑：鸟居柱子 / 社殿墙体 / 神樱树干
    for (const s of G.world.structs) {
      if (s.type === 'torii') {
        const half = (s.w || 64) / 2;
        const leftPillar = { x: s.x - half + 4, y: s.y - 50, w: 8, h: 50 };
        const rightPillar = { x: s.x + half - 12, y: s.y - 50, w: 8, h: 50 };
        for (const p of [leftPillar, rightPillar]) {
          if (px + r > p.x && px - r < p.x + p.w && py + r > p.y && py - r < p.y + p.h) return true;
        }
      } else if (s.type === 'shrine') {
        const halfW = (s.w || 160) / 2;
        const top = s.y - (s.h || 96);
        if (px + r > s.x - halfW && px - r < s.x + halfW && py + r > top && py - r < s.y) return true;
      } else if (s.type === 'house') {
        const halfW = (s.w || 112) / 2;
        const top = s.y - (s.h || 76);
        if (px + r > s.x - halfW && px - r < s.x + halfW && py + r > top && py - r < s.y) return true;
      } else if (s.type === 'sakura') {
        if (Math.abs(px - s.x) < 13 && py > s.y - 26 && py - r < s.y) return true;
      }
    }
    // 场景物件（树/石/灯笼/牌子的根部）
    const OBJ_HW = [7, 7, 6, 12, 6, 7];
    for (const o of G.OBJECTS) {
      const hw = OBJ_HW[o.t] || 8;
      if (px + r > o.x - hw && px - r < o.x + hw && py + r > o.y - 9 && py - r < o.y) {
        return true;
      }
    }
    return false;
  };

  // ---------- 绘制 ----------
  /** 场景物件：从 objects.png 取 32x48 的一格，底边对齐 (x, y)
   *  树按列号奇偶水平翻转，避免满屏一模一样的树 */
  G.drawObject = function (ctx, o, cam) {
    const img = G.assets.objects;
    if (!img) return;
    // 先在地上铺一层椭圆软影：物件不再像贴在画面上
    const sx = Math.round(o.x - cam.x);
    const sy = Math.round(o.y - cam.y);
    const wide = o.t === 0 || o.t === 1 ? 15 : 12;   // 树宽一点
    const tall = 5;
    ctx.fillStyle = 'rgba(10,14,18,0.22)';
    ctx.beginPath();
    ctx.ellipse(sx, sy - 2, wide, tall, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(10,14,18,0.14)';
    ctx.beginPath();
    ctx.ellipse(sx, sy - 2, wide - 4, tall - 2, 0, 0, Math.PI * 2);
    ctx.fill();
    const dx = Math.round(o.x - 16 - cam.x);
    const dy = Math.round(o.y - 48 - cam.y);
    const flip = o.t <= 2 && (o.x >> 4) % 2 === 1;
    if (flip) {
      ctx.save();
      ctx.translate(dx + 32, dy);
      ctx.scale(-1, 1);
      ctx.drawImage(img, o.t * 32, 0, 32, 48, 0, 0, 32, 48);
      ctx.restore();
    } else {
      ctx.drawImage(img, o.t * 32, 0, 32, 48, dx, dy, 32, 48);
    }
  };

  // ---------- 静态层：地形 + 地面装饰，整张图烘焙一次 ----------
  function paintTiles(g) {
    const t = G.TILE_SIZE;
    const img = G.assets.tiles;
    if (!img) return;
    const W = G.MAP_W, H = G.MAP_H;
    for (let ty = 0; ty < H; ty++) {
      for (let tx = 0; tx < W; tx++) {
        const id = G.tileAt(tx, ty);
        g.drawImage(
          img, (id % 8) * t, Math.floor(id / 8) * t, t, t,
          tx * t, ty * t, t, t
        );
      }
    }
  }

  function paintDecor(g) {
    const t = G.TILE_SIZE;
    const TT = G.TILE;
    const W = G.MAP_W, H = G.MAP_H;
    let petal = 0, tuft = 0, pebble = 0;
    // 奥宫是地下：不撒花瓣和草簇，只留碎石
    const cave = (G.currentMap === 'depths');
    for (let ty = 0; ty < H; ty++) {
      for (let tx = 0; tx < W; tx++) {
        const id = G.tileAt(tx, ty);
        if (id === TT.WATER || id === TT.WATER_B || id === TT.CLIFF || id === TT.VOID) continue;
        const h = G.hash2(tx, ty);
        if (h < 0.68) continue;
        const bx = tx * t;
        const by = ty * t;
        const ox = 1 + Math.floor(G.hash2(tx + 91, ty + 17) * 13);
        const oy = 2 + Math.floor(G.hash2(tx + 7, ty + 53) * 12);
        if (cave) {
          g.fillStyle = 'rgba(150,146,138,0.5)';
          g.fillRect(bx + ox, by + oy, 1, 1);
          if (h > 0.9) g.fillRect(bx + ox + 1, by + oy + 1, 1, 1);
          pebble++;
        } else if (h > 0.94) {
          g.fillStyle = 'rgba(244,198,216,0.9)';        // 落樱
          g.fillRect(bx + ox, by + oy, 2, 1);
          g.fillRect(bx + ox + 1, by + oy + 1, 1, 1);
          petal++;
        } else if (h > 0.85) {
          g.fillStyle = 'rgba(118,148,106,0.75)';       // 草簇
          g.fillRect(bx + ox, by + oy, 1, 2);
          g.fillRect(bx + ox + 1, by + oy + 1, 1, 1);
          g.fillRect(bx + ox - 1, by + oy + 1, 1, 1);
          tuft++;
        } else {
          g.fillStyle = 'rgba(154,148,136,0.5)';        // 碎石
          g.fillRect(bx + ox, by + oy, 1, 1);
          pebble++;
        }
      }
    }
    G.world.decorStats = { petal, tuft, pebble };
  }

  const ROADY = (id) => id === 3 || id === 4 || id === 5 || id === 6;
  const WATERY = (id) => id === 7 || id === 8;

  /** 地块交界的过渡：把 16px 的硬边打碎 */
  function paintEdges(g) {
    const t = G.TILE_SIZE;
    const TT = G.TILE;
    const W = G.MAP_W, H = G.MAP_H;
    let edge = 0;

    for (let ty = 0; ty < H; ty++) {
      for (let tx = 0; tx < W; tx++) {
        const id = G.tileAt(tx, ty);
        if (id === TT.VOID || id === TT.CLIFF) continue;
        const bx = tx * t;
        const by = ty * t;

        // --- 路与草的交界：草咬进路面一起，土屑咬进草里 ---
        if (ROADY(id)) {
          const near = [
            [0, -1], [0, 1], [-1, 0], [1, 0],
          ];
          for (const [dx, dy] of near) {
            const nx = tx + dx, ny = ty + dy;
            const nid = G.tileAt(nx, ny);
            if (ROADY(nid) || WATERY(nid) || nid === TT.VOID || nid === TT.CLIFF) continue;
            const h = G.hash2(tx * 7 + dx, ty * 13 + dy);
            if (h < 0.45) continue;
            // 沿这条边撒 2-3 粒土/草，位置带随机偏移
            const n = h > 0.8 ? 3 : 2;
            for (let k = 0; k < n; k++) {
              const r1 = G.hash2(tx + k * 31, ty + k * 17);
              const r2 = G.hash2(tx + k * 11 + 5, ty + k * 23 + 3);
              let px, py;
              if (dx === 0) {            // 上下边
                px = bx + 1 + Math.floor(r1 * (t - 2));
                py = dy < 0 ? by - 1 - Math.floor(r2 * 2) : by + t + Math.floor(r2 * 2);
              } else {                   // 左右边
                px = dx < 0 ? bx - 1 - Math.floor(r2 * 2) : bx + t + Math.floor(r2 * 2);
                py = by + 1 + Math.floor(r1 * (t - 2));
              }
              g.fillStyle = r2 > 0.5 ? 'rgba(126,96,64,0.75)' : 'rgba(104,132,96,0.7)';
              g.fillRect(px, py, 1, 1);
              edge++;
            }
          }
        }

        // --- 水与岸的交界：一条断续的浅色浪线 ---
        if (WATERY(id)) {
          const up = ty > 0 ? G.tileAt(tx, ty - 1) : TT.VOID;
          if (!WATERY(up) && up !== TT.VOID && up !== TT.CLIFF) {
            const h = G.hash2(tx * 3, ty * 5);
            if (h > 0.35) {
              const len = 3 + Math.floor(h * 5);
              const off = Math.floor(G.hash2(tx, ty + 9) * (t - len));
              g.fillStyle = 'rgba(226,240,246,0.35)';
              g.fillRect(bx + off, by + 1, len, 1);
              g.fillStyle = 'rgba(226,240,246,0.18)';
              g.fillRect(bx + off + 1, by + 2, Math.max(1, len - 2), 1);
              edge++;
            }
          }
        }
      }
    }
    // --- 草地的明暗斑块：打散纯色，让地面有起伏 ---
    let dapple = 0;
    for (let ty = 0; ty < H; ty++) {
      for (let tx = 0; tx < W; tx++) {
        const id = G.tileAt(tx, ty);
        if (id !== TT.GRASS && id !== TT.GRASS_DARK && id !== TT.GRASS_FLOWER) continue;
        const h0 = G.hash2(tx * 5 + 3, ty * 7 + 11);
        if (h0 < 0.55) continue;
        const bx2 = tx * t, by2 = ty * t;
        const n = h0 > 0.85 ? 3 : 2;
        for (let k = 0; k < n; k++) {
          const r1 = G.hash2(tx + k * 19, ty + k * 29);
          const r2 = G.hash2(tx + k * 37 + 7, ty + k * 13 + 5);
          const px = bx2 + Math.floor(r1 * (t - 4));
          const py = by2 + Math.floor(r2 * (t - 3));
          const wgt = 2 + Math.floor(r1 * 2);
          g.fillStyle = r2 > 0.5 ? 'rgba(20,34,22,0.16)' : 'rgba(120,150,104,0.12)';
          g.fillRect(px, py, wgt, 1);
          if (r1 > 0.6) g.fillRect(px + 1, py + 1, wgt - 1, 1);
          dapple++;
        }
      }
    }

    G.world.edgeStats = { edge, dapple };
  }

  /** 切图后调用：把整张地形压成一张画布 */
  G.buildStatic = function () {
    const t = G.TILE_SIZE;
    const W = G.MAP_W * t;
    const H = G.MAP_H * t;
    if (!G.assets.tiles || W <= 0 || H <= 0) return;
    const c = document.createElement('canvas');
    c.width = W;
    c.height = H;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    paintTiles(g);
    paintEdges(g);
    paintDecor(g);
    G.world.staticCanvas = c;
    G.world.staticKey = G.currentMap;
  };

  G.drawWorld = function (ctx, cam) {
    const sc = G.world.staticCanvas;
    if (sc && G.world.staticKey === G.currentMap) {
      // 一次 drawImage 顶掉两百多次逐格绘制
      ctx.drawImage(
        sc, cam.x, cam.y, G.VIEW_W, G.VIEW_H,
        0, 0, G.VIEW_W, G.VIEW_H
      );
    } else {
      ctx.save();
      ctx.translate(-cam.x, -cam.y);
      paintTiles(ctx);
      paintDecor(ctx);
      ctx.restore();
    }

    // 建筑（会动的那部分，仍然逐帧画）
    for (const s of G.world.structs) {
      if (s.type === 'torii') drawTorii(ctx, s.x - cam.x, s.y - cam.y, s.w || 64);
      else if (s.type === 'shrine') drawShrine(ctx, s.x - cam.x, s.y - cam.y, s.w || 160, s.h || 96);
      else if (s.type === 'house') drawHouse(ctx, s.x - cam.x, s.y - cam.y, s.w || 112, s.h || 76);
      else if (s.type === 'sakura') drawSakura(ctx, s.x - cam.x, s.y - cam.y);
      else if (s.type === 'altar') drawAltar(ctx, s.x - cam.x, s.y - cam.y);
    }
  };

  /** 鸟居：两根柱子 + 笠木 + 贯 + 额束 */
  function drawTorii(ctx, cx, cy, W) {
    const H = 56;
    const left = cx - W / 2;
    const red = '#c0392b';
    const dark = '#8e2b20';
    const black = '#2f2a33';

    // 柱
    ctx.fillStyle = red;
    ctx.fillRect(left + 4, cy - H + 10, 8, H - 10);
    ctx.fillRect(cx + W / 2 - 12, cy - H + 10, 8, H - 10);
    ctx.fillStyle = dark;
    ctx.fillRect(left + 4, cy - H + 10, 2, H - 10);
    ctx.fillRect(cx + W / 2 - 12, cy - H + 10, 2, H - 10);

    // 笠木（顶梁，两端上翘）
    ctx.fillStyle = black;
    ctx.fillRect(left - 4, cy - H, W + 8, 5);
    ctx.fillRect(left - 8, cy - H - 3, 6, 4);
    ctx.fillRect(cx + W / 2 + 2, cy - H - 3, 6, 4);

    // 贯（第二道横梁）
    ctx.fillStyle = red;
    ctx.fillRect(left, cy - H + 14, W, 5);

    // 额束
    ctx.fillStyle = dark;
    ctx.fillRect(cx - 3, cy - H + 19, 6, 9);

    // 影子
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(cx, cy + 1, W / 2 + 2, 4, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  /** 社殿：石基 + 朱柱 + 深蓝屋顶 */
  function drawShrine(ctx, cx, cy, W, H) {
    const half = W / 2;
    const red = '#b8352b';
    const dark = '#7e211a';
    const roof = '#2f3d52';
    const roofL = '#44566f';
    const cream = '#efe6d2';

    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath();
    ctx.ellipse(cx, cy - 2, half + 6, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // 石基与台阶
    ctx.fillStyle = '#8f8b80';
    ctx.fillRect(cx - half, cy - 18, W, 18);
    ctx.fillStyle = '#a6a196';
    ctx.fillRect(cx - half, cy - 18, W, 4);
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i % 2 ? '#9a958a' : '#a8a398';
      ctx.fillRect(cx - 30 + i * 4, cy - 6 + i * 6, 60 - i * 8, 6);
    }

    // 墙体
    ctx.fillStyle = cream;
    ctx.fillRect(cx - half + 12, cy - H + 40, W - 24, H - 58);
    // 朱柱
    ctx.fillStyle = red;
    for (let i = 0; i <= 4; i++) {
      const px = cx - half + 12 + i * ((W - 24) / 4) - 3;
      ctx.fillRect(px, cy - H + 40, 6, H - 58);
      ctx.fillStyle = dark;
      ctx.fillRect(px, cy - H + 40, 2, H - 58);
      ctx.fillStyle = red;
    }
    // 门
    ctx.fillStyle = '#3a2f2a';
    ctx.fillRect(cx - 16, cy - H + 58, 32, H - 76);

    // 屋顶（两层）
    ctx.fillStyle = roof;
    ctx.beginPath();
    ctx.moveTo(cx - half - 14, cy - H + 40);
    ctx.lineTo(cx - half + 10, cy - H + 14);
    ctx.lineTo(cx + half - 10, cy - H + 14);
    ctx.lineTo(cx + half + 14, cy - H + 40);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = roofL;
    ctx.beginPath();
    ctx.moveTo(cx - half + 8, cy - H + 16);
    ctx.lineTo(cx - 20, cy - H - 4);
    ctx.lineTo(cx + 20, cy - H - 4);
    ctx.lineTo(cx + half - 8, cy - H + 16);
    ctx.closePath();
    ctx.fill();
    // 屋脊
    ctx.fillStyle = '#222c3c';
    ctx.fillRect(cx - 26, cy - H - 7, 52, 5);
    // 千木
    ctx.strokeStyle = '#222c3c';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx - 30, cy - H - 10); ctx.lineTo(cx - 20, cy - H - 22);
    ctx.moveTo(cx + 30, cy - H - 10); ctx.lineTo(cx + 20, cy - H - 22);
    ctx.stroke();

    // 注连绳
    ctx.fillStyle = '#dcc9a0';
    ctx.fillRect(cx - 34, cy - H + 44, 68, 4);
    ctx.fillStyle = '#f3ecde';
    for (let i = 0; i < 4; i++) ctx.fillRect(cx - 28 + i * 18, cy - H + 48, 4, 8);
  }

  /** 町家：石基 + 木墙 + 灰瓦 */
  function drawHouse(ctx, cx, cy, W, H) {
    const half = W / 2;
    const wall = '#e8dcc4';
    const wood = '#6b4a34';
    const roof = '#4a4a56';
    const roofL = '#646472';

    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(cx, cy - 2, half + 4, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#8f8b80';
    ctx.fillRect(cx - half, cy - 12, W, 12);
    ctx.fillStyle = wall;
    ctx.fillRect(cx - half + 6, cy - H + 26, W - 12, H - 38);
    // 木构
    ctx.fillStyle = wood;
    ctx.fillRect(cx - half + 6, cy - H + 26, 3, H - 38);
    ctx.fillRect(cx + half - 9, cy - H + 26, 3, H - 38);
    ctx.fillRect(cx - half + 6, cy - H + 26, W - 12, 3);
    ctx.fillRect(cx - 12, cy - 26, 24, 26);           // 门
    ctx.fillStyle = '#3a2c24';
    ctx.fillRect(cx - 8, cy - 22, 16, 22);
    // 窗
    ctx.fillStyle = '#8fb6c8';
    ctx.fillRect(cx - half + 18, cy - H + 40, 20, 14);
    ctx.fillRect(cx + half - 38, cy - H + 40, 20, 14);
    ctx.strokeStyle = wood;
    ctx.strokeRect(cx - half + 18.5, cy - H + 40.5, 19, 13);
    ctx.strokeRect(cx + half - 37.5, cy - H + 40.5, 19, 13);

    // 屋顶
    ctx.fillStyle = roof;
    ctx.beginPath();
    ctx.moveTo(cx - half - 10, cy - H + 28);
    ctx.lineTo(cx - half + 8, cy - H + 8);
    ctx.lineTo(cx + half - 8, cy - H + 8);
    ctx.lineTo(cx + half + 10, cy - H + 28);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = roofL;
    ctx.fillRect(cx - half + 8, cy - H + 12, W - 16, 3);
    ctx.fillStyle = '#34343e';
    ctx.fillRect(cx - half + 6, cy - H + 5, W - 12, 4);
  }

  /** 神樱：一根粗干 + 六簇树冠 */
  function drawSakura(ctx, cx, cy) {
    const pink = ['#c67a9c', '#de92b4', '#eeaac6', '#f7c4da'];
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath();
    ctx.ellipse(cx, cy - 2, 30, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#5c3f34';
    ctx.fillRect(cx - 8, cy - 44, 16, 44);
    ctx.fillStyle = '#3f2a22';
    ctx.fillRect(cx + 3, cy - 44, 5, 44);

    const blobs = [
      [-26, -58, 26], [0, -74, 30], [26, -58, 26],
      [-16, -88, 20], [16, -88, 20], [0, -104, 18],
    ];
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = pink[i];
      for (const [dx, dy, r] of blobs) {
        ctx.beginPath();
        ctx.ellipse(cx + dx, cy + dy + i * 2, r - i * 3, (r - i * 3) * 0.82, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  /** 奥宫祭坛：三层石台 + 悬浮雷球 */
  function drawAltar(ctx, cx, cy) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(cx, cy - 2, 44, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    const tiers = [[80, 14], [60, 12], [40, 12]];
    let y = cy;
    for (const [w, h] of tiers) {
      ctx.fillStyle = '#585265';
      ctx.fillRect(cx - w / 2, y - h, w, h);
      ctx.fillStyle = '#6e677d';
      ctx.fillRect(cx - w / 2, y - h, w, 3);
      y -= h;
    }
    // 悬浮雷球
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 320);
    ctx.fillStyle = `rgba(177,140,255,${0.25 + pulse * 0.25})`;
    ctx.beginPath();
    ctx.arc(cx, y - 16, 16 + pulse * 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#d8c4ff';
    ctx.beginPath();
    ctx.arc(cx, y - 16, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  /** 走路扬尘 */
  G.drawDust = function (ctx, cam) {
    if (!G.dust || !G.dust.length) return;
    for (const d of G.dust) {
      const a = Math.max(0, d.t / d.max);
      const r = Math.round((1 - a) * 3) + 1;
      ctx.fillStyle = `rgba(228,232,220,${(0.32 * a).toFixed(3)})`;
      ctx.fillRect(
        Math.round(d.x - cam.x - r / 2),
        Math.round(d.y - cam.y - 2 - (1 - a) * 4),
        r, r
      );
    }
  };

  /** 野猫：一小团黑，尾巴会摆 */
  G.drawCat = function (ctx, x, y, cam, t) {
    const sx = Math.round(x - cam.x);
    const sy = Math.round(y - cam.y);
    const wag = Math.sin((t || 0) * 2.2) * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(sx, sy, 7, 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#211c26';
    ctx.beginPath();
    ctx.ellipse(sx, sy - 5, 6, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();
    // 耳朵
    ctx.beginPath();
    ctx.moveTo(sx - 5, sy - 7); ctx.lineTo(sx - 4, sy - 11); ctx.lineTo(sx - 2, sy - 8);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(sx + 5, sy - 7); ctx.lineTo(sx + 4, sy - 11); ctx.lineTo(sx + 2, sy - 8);
    ctx.closePath(); ctx.fill();
    // 尾巴
    ctx.strokeStyle = '#211c26';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sx + 5, sy - 4);
    ctx.quadraticCurveTo(sx + 10, sy - 8 + wag, sx + 9, sy - 12 + wag);
    ctx.stroke();
    // 眼睛
    ctx.fillStyle = '#f0d79a';
    ctx.fillRect(sx - 3, sy - 6, 1, 1);
    ctx.fillRect(sx + 2, sy - 6, 1, 1);
  };

  /** 地上的道具：浮动的菱形 */
  G.drawPickup = function (ctx, p, cam, t) {
    const it = G.ITEMS && G.ITEMS[p.item];
    if (!it) return;
    const x = Math.round(p.x - cam.x);
    const bob = Math.sin(t * 3 + p.x) * 2;
    const y = Math.round(p.y - 12 - cam.y + bob);
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath();
    ctx.ellipse(x, Math.round(p.y - cam.y), 6, 2, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = it.color || '#fff';
    ctx.beginPath();
    ctx.moveTo(x, y - 6);
    ctx.lineTo(x + 5, y);
    ctx.lineTo(x, y + 6);
    ctx.lineTo(x - 5, y);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 1;
    ctx.stroke();
  };
})();

</script>
  <script>
/**
 * player.js —— 玩家移动、碰撞、动画；NPC 绘制与交互查询
 */
(function () {
  'use strict';
  const G = (window.G = window.G || {});

  const SPEED = 78;        // 像素/秒
  const RADIUS = 5;        // 脚底碰撞半径
  const FRAME_TIME = 0.16; // 每帧行走时长

  G.player = {
    x: 0, y: 0,
    dir: 1,          // 0下 1上 2左 3右
    moving: false,
    animT: 0,
    frame: 0,
    sprite: 0,
  };

  G.initPlayer = function () {
    G.player.x = G.START.x;
    G.player.y = G.START.y;
    G.player.dir = G.START.dir;
  };

  G.updatePlayer = function (dt) {
    const p = G.player;
    if (G.dialogue && G.dialogue.active) {
      p.moving = false;
      return;
    }
    let dx = 0, dy = 0;
    if (G.keys.left) dx -= 1;
    if (G.keys.right) dx += 1;
    if (G.keys.up) dy -= 1;
    if (G.keys.down) dy += 1;

    // 朝向优先水平
    if (dx !== 0 || dy !== 0) {
      if (Math.abs(dx) >= Math.abs(dy)) p.dir = dx > 0 ? 3 : 2;
      else p.dir = dy > 0 ? 0 : 1;
    }

    // 归一化斜向速度
    if (dx !== 0 && dy !== 0) {
      const k = Math.SQRT1_2;
      dx *= k; dy *= k;
    }

    // 走路扬尘：脚下每隔一小段留一粒，移动才有「踩在地上」的感觉
    G.dust = G.dust || [];
    G.dustT = (G.dustT || 0) - dt;
    const step = SPEED * (G.fieldSpeedMul || 1) * dt;
    p.moving = dx !== 0 || dy !== 0;
    if (p.moving && G.dustT <= 0) {
      G.dustT = 0.075;
      G.dust.push({ x: p.x + (Math.random() - 0.5) * 5, y: p.y, t: 0.5, max: 0.5 });
      if (G.dust.length > 24) G.dust.shift();
    }
    for (const d of G.dust) d.t -= dt;
    G.dust = G.dust.filter((d) => d.t > 0);

    // 分轴移动，撞墙时还能贴边滑动
    if (dx !== 0) {
      const nx = p.x + dx * step;
      if (!G.isBlocked(nx, p.y, RADIUS)) p.x = nx;
    }
    if (dy !== 0) {
      const ny = p.y + dy * step;
      if (!G.isBlocked(p.x, ny, RADIUS)) p.y = ny;
    }

    // 限制在地图内
    const maxX = G.MAP_W * G.TILE_SIZE - 8;
    const maxY = G.MAP_H * G.TILE_SIZE - 4;
    p.x = Math.max(8, Math.min(p.x, maxX));
    p.y = Math.max(12, Math.min(p.y, maxY));

    // 动画
    if (p.moving) {
      p.animT += dt;
      if (p.animT >= FRAME_TIME) {
        p.animT -= FRAME_TIME;
        p.frame = 1 - p.frame;
      }
    } else {
      p.frame = 0;
      p.animT = 0;
    }
  };

  /** 画一个角色：spriteRow 是 chars.png 的行号（16x32） */
  G.drawChar = function (ctx, spriteRow, x, y, dir, frame, cam) {
    const img = G.assets.chars;
    if (!img) return;
    const sx = (dir * 2 + frame) * 16;
    const sy = spriteRow * 32;
    const dx = Math.round(x - 8 - cam.x);
    const dy = Math.round(y - 31 - cam.y);
    ctx.drawImage(img, sx, sy, 16, 32, dx, dy, 16, 32);
  };

  G.drawPlayer = function (ctx, cam) {
    const p = G.player;
    G.drawChar(ctx, p.sprite, p.x, p.y, p.dir, p.frame, cam);
  };

  /** 找脚下最近的、且面朝它的 NPC */
  G.nearestNPC = function () {
    const p = G.player;
    let best = null;
    let bestD = 30;
    for (const n of G.NPCS) {
      const d = Math.hypot(n.x - p.x, n.y - p.y);
      if (d < bestD) { bestD = d; best = n; }
    }
    return best;
  };
})();

/**
 * dialogue.js —— 对话框、立绘、逐字显示
 */
(function () {
  'use strict';
  const G = (window.G = window.G || {});

  const BOX_H = 66;
  const BOX_PAD = 10;
  const PORTRAIT_W = 64;
  const PORTRAIT_H = 96;
  const CPS = 34; // 每秒字数

  G.dialogue = {
    active: false,
    npc: null,
    lines: [],
    li: 0,
    revealed: 0,
    wrapped: [],
    done: false,
  };

  // 语气判定的差分表：角色 id → { excited, calm }
  const EXPRESSIONS = {
    ayaka: { excited: 'ayaka_worry', calm: 'ayaka_worry' },
  };

  /** 按这一句的语气挑立绘；没有差分就回落默认 */
  function portraitFor(npc, text) {
    const base = npc.portrait;
    const map = EXPRESSIONS[npc.id] || EXPRESSIONS[base];
    if (!map) return G.assets.portraits[base];
    let key = null;
    if (/！|!/.test(text)) key = map.excited;
    else if (/…|\.\.\./.test(text)) key = map.calm;
    const img = key && G.assets.portraits[key];
    return img || G.assets.portraits[base];
  }

  G.startDialogue = function (npc) {
    const d = G.dialogue;
    d.active = true;
    d.npc = npc;
    if (npc.dynamic && G.mikoLines) npc.lines = G.mikoLines();
    // 条件台词：按旗标优先，其次通关后台词，最后默认
    let useLines = null;
    // 轮次对话：第几次来找她，决定说哪一段
    let talkIdx = -1;
    if (npc.talks && npc.talks.length) {
      const t = (G.progress.talk || {});
      talkIdx = t[npc.id] || 0;
      // 说完了就返回 null，让条件台词 / 默认台词接手
      if (talkIdx < npc.talks.length) useLines = npc.talks[talkIdx].slice();
    }
    if (!useLines && npc.linesIf) {
      for (const v of npc.linesIf) {
        const hit = v.flags ? v.flags.every((f) => G.flags[f]) : true;
        const miss = v.notFlags ? v.notFlags.every((f) => !G.flags[f]) : true;
        if (hit && miss) { useLines = v.lines; break; }
      }
    }
    if (!useLines) {
      useLines = (G.postGame && G.postGame() && npc.postLines) ? npc.postLines : npc.lines;
    }
    d.lines = useLines.slice();
    d.li = 0;
    d.revealed = 0;
    d.done = false;
    d.wrapped = [];
  };

  G.endDialogue = function () {
    const d = G.dialogue;
    const npc = d.npc;
    d.active = false;
    d.npc = null;
    // 轮次推进：这段说完了，下次说下一段
    if (npc && npc.talks && npc.talks.length) {
      G.progress.talk = G.progress.talk || {};
      const cur = G.progress.talk[npc.id] || 0;
      if (cur < npc.talks.length) G.progress.talk[npc.id] = cur + 1;
      if (G.writeProgress) G.writeProgress();
    }
    if (npc && typeof npc.onEnd === 'function') { try { npc.onEnd(); } catch (e) {} }
  };

  G.dialogueUpdate = function (dt) {
    const d = G.dialogue;
    if (!d.active) return;

    const text = d.lines[d.li] || '';
    const total = text.length;

    if (!d.done) {
      const fast = G.keys.action ? 3.2 : 1;   // 按住空格加速
      const step = CPS * fast * dt;
      d.revealed += step;
      d.blip = (d.blip || 0) + step;
      if (d.blip >= 5) { d.blip = 0; if (G.sfx) G.sfx.play('blip'); }
      if (d.revealed >= total) {
        d.revealed = total;
        d.done = true;
      }
    }

    // Esc 直接关掉
    if (G.pressed.cancel) {
      G.pressed.cancel = false;
      G.endDialogue();
      return;
    }

    if (G.pressed.action) {
      // 吃掉这次按键：否则同一帧里「刚结束对话」会立刻被当成「开始对话」
      G.pressed.action = false;

      if (!d.done) {
        d.revealed = total;   // 先一次性显示完
        d.done = true;
      } else if (d.li < d.lines.length - 1) {
        d.li++;
        d.revealed = 0;
        d.done = false;
        d.blip = 0;
        d.wrapped = [];
      } else {
        G.endDialogue();
      }
    }
  };

  function wrap(ctx, text, maxWidth) {
    const out = [];
    let line = '';
    for (const ch of text) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxWidth && line) {
        out.push(line);
        line = ch;
      } else {
        line = test;
      }
    }
    if (line) out.push(line);
    return out;
  }

  G.drawDialogue = function (ctx) {
    const d = G.dialogue;
    if (!d.active || !d.npc) return;

    const bx = 8;
    const by = G.VIEW_H - BOX_H - 8;
    const bw = G.VIEW_W - 16;
    const bh = BOX_H;

    // 半透明底 + 描边
    ctx.fillStyle = 'rgba(18,16,22,0.92)';
    G.roundRect(ctx, bx, by, bw, bh, 4);
    ctx.fill();
    ctx.strokeStyle = '#f3ecde';
    ctx.lineWidth = 1;
    G.roundRect(ctx, bx + 0.5, by + 0.5, bw - 1, bh - 1, 4);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(180,160,130,0.35)';
    G.roundRect(ctx, bx + 3.5, by + 3.5, bw - 7, bh - 7, 3);
    ctx.stroke();

    // 立绘
    const portrait = portraitFor(d.npc, d.lines[d.li] || '');
    if (portrait) {
      const px = bx + 4;
      // 轻微呼吸浮动，别像贴纸
      const breathe = Math.sin((performance.now() / 1000) * 1.6) * 1.2;
      const py = by - PORTRAIT_H + bh - 2 + breathe;
      // 底：暗色 + 从底部透出的元素色
      ctx.fillStyle = 'rgba(26,22,30,0.92)';
      ctx.fillRect(px, py, PORTRAIT_W, PORTRAIT_H);
      ctx.drawImage(portrait, px, py, PORTRAIT_W, PORTRAIT_H);
      const elemC = (G.ELEM[d.npc.element] || {}).c || 'rgba(243,236,222,0.9)';
      // 内描边（元素色）+ 外描边（浅色）
      ctx.globalAlpha = 0.55;
      ctx.strokeStyle = elemC;
      ctx.lineWidth = 2;
      ctx.strokeRect(px + 1, py + 1, PORTRAIT_W - 2, PORTRAIT_H - 2);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = 'rgba(243,236,222,0.85)';
      ctx.lineWidth = 1;
      ctx.strokeRect(px + 0.5, py + 0.5, PORTRAIT_W - 1, PORTRAIT_H - 1);
    }

    const textX = bx + (portrait ? PORTRAIT_W + 14 : 12);
    const textW = bw - (textX - bx) - 12;

    // 名字条
    ctx.font = 'bold 10px "Microsoft YaHei", sans-serif';
    const nameW = ctx.measureText(d.npc.name).width + 14;
    ctx.fillStyle = '#7a3b34';
    G.roundRect(ctx, textX - 2, by - 12, nameW, 14, 3);
    ctx.fill();
    ctx.fillStyle = '#f3ecde';
    ctx.fillText(d.npc.name, textX + 5, by - 1);

    // 正文
    ctx.font = '10px "Microsoft YaHei", sans-serif';
    if (d.wrapped.length === 0 || d.wrappedFor !== d.li) {
      d.wrapped = wrap(ctx, d.lines[d.li] || '', textW);
      d.wrappedFor = d.li;
    }
    const shown = Math.floor(d.revealed);
    let count = 0;
    let ty = by + 18;
    for (const line of d.wrapped) {
      let drawStr = '';
      for (const ch of line) {
        if (count < shown) { drawStr += ch; count++; }
        else break;
      }
      if (drawStr) {
        ctx.fillStyle = '#f3ecde';
        ctx.fillText(drawStr, textX, ty);
      }
      ty += 14;
    }

    // 继续提示
    if (d.done) {
      const t = (performance.now() / 400) % 2;
      if (t < 1) {
        ctx.fillStyle = '#e8c882';
        const ax = bx + bw - 14;
        const ay = by + bh - 12;
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(ax + 7, ay);
        ctx.lineTo(ax + 3.5, ay + 5);
        ctx.closePath();
        ctx.fill();
      }
    }
  };
})();

  G.startEnding = function () {

    e.revealed = 0;
    e.done = false;
    e.creditsY = 0;
    e.fade = 1;

    for (let i = 0; i < 40; i++) {
      e.petals.push({
        x: Math.random() * G.VIEW_W,

  function curSlide() { return SLIDES[G.ending.slide] || null; }

  function slideText(s) {
    if (!s) return '';

  G.updateEnding = function (dt) {
    const e = G.ending;

    for (const p of e.petals) {

  function next() {

    e.creditsY = 0;
    if (G.sfx) G.sfx.play('confirm');

  function finish() {

  }

  // ---------- 绘制 ----------
  function backdrop(ctx, kind, t) {
    const W = G.VIEW_W, H = G.VIEW_H;
    if (kind === 'sakura') {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#1b1626');
      g.addColorStop(1, '#2a1f30');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      ctx.lineTo(360, H - 110);

      ctx.fill();
      // 地平线薄雾

      mist.addColorStop(0, 'rgba(120,100,150,0)');
      mist.addColorStop(1, 'rgba(120,100,150,0.16)');

      halo.addColorStop(0.45, 'rgba(230,160,150,0.12)');
      halo.addColorStop(1, 'rgba(0,0,0,0)');

      g.addColorStop(1, '#1a1424');

  function motes(ctx, kind, t) {

    const n = kind === 'sakura' ? 26 : 34;
    for (let i = 0; i < n; i++) {
      const seed = (i * 9301 + 49297) % 233280 / 233280;

  function wrapText(ctx, text, maxW) {
    const out = [];
    for (const line of text.split('\n')) {
      let cur = '';

        if (ctx.measureText(cur + ch).width > maxW && cur) { out.push(cur); cur = ch; }

      g.addColorStop(1, '#161020');

      ctx.fillText('终 章', W / 2, H / 2 - 6);
      ctx.fillStyle = 'rgba(240,215,154,0.55)';
      ctx.font = '11px "Microsoft YaHei", serif';
      ctx.fillText('雷 樱 纪', W / 2, H / 2 + 22);
      ctx.textAlign = 'left';
    } else if (s.kind === 'credits') {
      ctx.fillStyle = '#0b0910';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      CREDITS.forEach((row, i) => {
        const y = H - e.creditsY + i * 16;
        if (y < -20 || y > H + 20) return;
        ctx.font = '10px "Microsoft YaHei", sans-serif';
        ctx.fillStyle = row[0].startsWith('——') || row[0] === '雷 樱 纪' ? '#f0d79a' : 'rgba(230,224,212,0.85)';
        if (row[0]) ctx.fillText(row[0], W / 2 - 60, y);
        if (row[1]) ctx.fillText(row[1], W / 2 + 60, y);
      });
      ctx.textAlign = 'left';
    } else {
      backdrop(ctx, s.scene, e.t);
      // 落樱
      ctx.fillStyle = 'rgba(240,180,205,0.65)';
      for (const p of e.petals) {
        ctx.fillRect(Math.round(p.x), Math.round(p.y), Math.round(p.r + 1) + 1, Math.max(1, Math.round(p.r)));
      }
      // 字幕
      const text = slideText(s);
      const shown = text.slice(0, Math.floor(e.revealed));
      ctx.font = '12px "Microsoft YaHei", serif';
      const lines = wrapText(ctx, shown, W - 120);
      ctx.textAlign = 'center';
      lines.forEach((ln, i) => {
        const y = H - 90 + i * 18;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillText(ln, W / 2 + 1, y + 1);
        ctx.fillStyle = '#efe9dc';
        ctx.fillText(ln, W / 2, y);
      });
      ctx.textAlign = 'left';
    }

    if (e.fade > 0) {
      ctx.fillStyle = `rgba(6,5,9,${e.fade})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (e.done && s.kind !== 'credits') {
      const blink = (performance.now() / 500) % 2 < 1;
      if (blink) {
        ctx.fillStyle = 'rgba(240,215,154,0.8)';
        ctx.textAlign = 'center';
        ctx.font = '10px "Microsoft YaHei", sans-serif';
        ctx.fillText('空格 继续　Esc 跳过', G.VIEW_W / 2, G.VIEW_H - 14);
        ctx.textAlign = 'left';
      }
    }
  };
})();

  <script>
/**
 * cutscene.js —— 章节之间的事件戏
 *
 * 进大社、打完雷兽、进町街、开西侧门、进奥宫、打完最终 BOSS——
 * 这些节点原来只有一两行提示，现在有整段过场对话。
 *
 * 每条只播一次，播完设一个 flag。
 */
(function () {
  'use strict';
  const G = (window.G = window.G || {});

  /** 每条：id / cond（什么时候播）/ 说话人 / 立绘 / lines / onEnd */
  G.CUTSCENES = [
    {
      id: 'cs_enter_shrine',
      cond: () => G.flags.entered_shrine && !G.flags.cs_enter_shrine,
      name: '八重神子',
      portrait: 'miko',
      lines: [
        '「你进来了。」',
        '「五百年，这社一点没变。你知道为什么吗？」',
        '「不是没人想变。是没人敢动。」',
        '「社殿的柱子换过三次，神樱的根断过两次，只有这台阶——一级都没动过。」',
        '「……我在想，如果我走了，这里会不会散。」',
        '「算了。看那边，神樱的根。」',
      ],
      onEnd: () => G.flagSet('cs_enter_shrine'),
    },
    {
      id: 'cs_after_beast',
      cond: () => G.flags.chapter1_done && !G.flags.cs_after_beast,
      name: '八重神子',
      portrait: 'miko',
      lines: [
        '「雷兽倒了。」',
        '「你下手很快。快到我来不及看它最后一眼。」',
        '「……它不是我养的东西。我没有那个本事。」',
        '「但它倒下去的时候，我在想一件事。」',
        '「它为什么往上走？」',
        '「底下有什么，逼得一头雷兽都要往上跑。」',
      ],
      onEnd: () => G.flagSet('cs_after_beast'),
    },
    {
      id: 'cs_enter_town',
      cond: () => G.flags.reached_town && !G.flags.cs_enter_town,
      name: '',
      portrait: null,
      lines: [
        '（町街的空气里有铁锈味，还有一点焦。）',
        '（街上人不多。有人隔着窗看你，又立刻移开视线。）',
        '（东口那边，有东西在动。）',
      ],
      onEnd: () => G.flagSet('cs_enter_town'),
    },
    {
      id: 'cs_after_town_boss',
      cond: () => G.flags.chapter2_done && !G.flags.cs_after_town_boss,
      name: '枫原万叶',
      portrait: 'kazuha',
      lines: [
        '「打完了？」',
        '「我站在街那头，一直听。」',
        '「风里有三种声音：你的雷，那个东西的喘，还有——街上的人在屏息。」',
        '「现在只剩第一种了。」',
        '「……不过，风还没停。它只是换了方向。」',
        '「往上吹了。」',
      ],
      onEnd: () => G.flagSet('cs_after_town_boss'),
    },
    {
      id: 'cs_enter_depths',
      cond: () => G.flags.entered_depths && !G.flags.cs_enter_depths,
      name: '',
      portrait: null,
      lines: [
        '（这里没有风。）',
        '（脚下的石阶是干净的。干净得不像有人来过。）',
        '（但你听得见自己的心跳。）',
        '（还有，很远的地方，有水滴在石头上。）',
      ],
      onEnd: () => G.flagSet('cs_enter_depths'),
    },
    {
      id: 'cs_after_final',
      cond: () => G.flags.final_boss && !G.flags.cs_after_final,
      name: '',
      portrait: null,
      lines: [
        '（它散了。）',
        '（不是被打散的那种散。是像雾一样，慢慢淡掉的。）',
        '（最后一刻它没有喊，也没有看你。）',
        '（它好像在等什么，等了很久，最后没等到。）',
        '（地面上有一样东西。）',
        '（是一截断了的簪子。铜的。）',
      ],
      onEnd: () => G.flagSet('cs_after_final'),
    },
  ];

  /** 每帧检查一次；有就播，播完设 flag */
  G.checkCutscene = function () {
    if (!G.CUTSCENES || !G.startDialogue) return false;
    if (G.dialogue && G.dialogue.active) return false;
    if (G.battle && G.battle.active) return false;
    if (G.fade > 0.05) return false;
    for (const c of G.CUTSCENES) {
      let ok = false;
      try { ok = c.cond(); } catch (e) { ok = false; }
      if (!ok) continue;
      const npc = {
        id: c.id,
        name: c.name,
        portrait: c.portrait,
        lines: c.lines.slice(),
        onEnd: c.onEnd,
        cutscene: true,
      };
      G.startDialogue(npc);
      return true;
    }
    return false;
  };
})();

      .map((id) => roster.find((r) => r.id === id))
      .filter(Boolean);
    if (picked.length) G.PARTY_DEF = picked;
    return G.PARTY_DEF;
  };

  G.toggleFormation = function (id) {
    const i = G.formation.indexOf(id);
    if (i >= 0) {
      if (G.formation.length <= 1) return 'last';   // 至少留一个
      G.formation.splice(i, 1);
      return 'removed';

    if (G.formation.length >= G.MAX_PARTY) return 'full';

  <script>
/**
 * battle-logic.js —— 纯数值逻辑，不碰画布，可在 node 里直接测。
 * 元素反应除了伤害倍率，还会挂上状态：冻结、麻痹、破防、降防、护盾、增伤。
 */
(function () {
  'use strict';
  const G = (window.G = window.G || {});

  G.BL = {
    /** 防御减伤：def 越高，减得越多，但永远不会减到 0 */
    mitigate(def, ignoreDef) {
      const d = Math.max(0, def * (1 - (ignoreDef || 0)));
      return 1 - d / (d + 200);
    },

    /** 同元素抗性 */
    sameElementMul(attElem, enemyElem) {
      return attElem && enemyElem && attElem === enemyElem ? 0.75 : 1;
    },

    /** 把反应转换成状态 */
    applyStatus(effect, enemy, actor) {
      if (!effect) return '';
      const e = enemy;
      const a = actor;
      switch (effect) {
        case '麻痹':
          e.dot = { turns: 2, dmg: Math.max(8, Math.round(e.maxHp * 0.05)) };
          return '感电：持续掉血';
        case '破防':
          e.atkDown = 2;
          return '超载：攻击下降';
        case '降防':
          e.defDown = 3;
          return '超导：防御下降';
        case '增伤':
        case '连击':
          a.buff = { turns: 2, mul: 0.3 };
          return '下一击更重';
        case '护盾':
          a.shield = Math.max(a.shield || 0, Math.round(a.maxHp * 0.15));
          return '获得护盾';
        case '冻结':
          e.frozen = 1;
          return '冻结：无法行动';
        default:
          return '';
      }
    },

    /**
     * 一次命中：先结算元素反应，再算伤害，最后挂状态。
     * enemy.aura 是敌人身上残留的元素。
     */
    hit({ skill, attacker, enemy, rng }) {
      const rnd = rng || Math.random;
      const attElem = skill.element || attacker.element;
      let react = null;
      let reactMul = 1;
      let statusText = '';
      const old = enemy.aura;

      if (attElem && old && old !== attElem) {
        react = G.reactionOf(old, attElem);
        if (react) {
          reactMul = react.mul;
          enemy.aura = old === enemy.element ? old : null;
        } else {
          enemy.aura = attElem;
        }
      } else if (attElem && !old) {
        enemy.aura = attElem;
      }

      // 角色身上的「增伤」状态
      let buffMul = 1;
      if (attacker.buff && attacker.buff.turns > 0) {
        buffMul = 1 + attacker.buff.mul;
        attacker.buff.turns -= 1;
        if (attacker.buff.turns <= 0) attacker.buff = null;
      }

      const defNow = enemy.def * (enemy.defDown > 0 ? 0.7 : 1);
      const mit = this.mitigate(defNow, skill.ignoreDef);
      const same = this.sameElementMul(attElem, enemy.element);
      const variance = 0.95 + rnd() * 0.1;

      // 角色特征：乘区在这里叠加
      const tr = (G.traitOf && G.traitOf(attacker.id)) || {};
      let traitMul = 1;
      if (tr.allMul) traitMul *= 1 + tr.allMul;
      if (tr.elemMul && attElem === tr.elem) traitMul *= 1 + tr.elemMul;
      let critMul = 1;
      if (rnd() < (tr.crit || 0)) critMul = 1.5; // 天狗的暴击

      const dmg = Math.max(1, Math.round(
        skill.power * attacker.atk * mit * same * reactMul * buffMul * variance * traitMul * critMul
      ));
      enemy.hp = Math.max(0, enemy.hp - dmg);

      if (react) statusText = this.applyStatus(react.effect, enemy, attacker);
      // 神里绫华的霜见：有概率直接把敌人冻住
      if (tr.freeze && rnd() < tr.freeze && enemy.hp > 0) {
        enemy.status = enemy.status || {};
        enemy.status.freeze = Math.max(1, enemy.status.freeze || 0);
        statusText = (statusText ? statusText + '；' : '') + '冻结！';
      }

      return { dmg, react, statusText };
    },

    /** 敌人打我方角色（会被护盾吸收） */
    enemyHit({ move, enemy, target, rng }) {
      const rnd = rng || Math.random;
      const mit = this.mitigate(target.def, 0);
      const same = this.sameElementMul(move.element || enemy.element, target.element);
      const variance = 0.95 + rnd() * 0.1;
      const atkDown = enemy.atkDown > 0 ? 0.7 : 1;
      // 枫原万叶的叶隐：有概率完全躲开
      const trD = (G.traitOf && G.traitOf(target.id)) || {};
      if (trD.dodge && rnd() < trD.dodge) {
        return { dmg: 0, dodged: true, absorbed: 0, shieldLeft: target.shield || 0 };
      }
      let dmg = Math.max(1, Math.round(move.power * enemy.atk * atkDown * mit * same * variance));

      let absorbed = 0;
      if (target.shield > 0) {
        absorbed = Math.min(target.shield, dmg);
        target.shield -= absorbed;
        if (target.shield <= 0) target.shield = 0;
        dmg -= absorbed;
      }
      target.hp = Math.max(0, target.hp - dmg);
      return { dmg, absorbed };
    },

    /** 敌人能否行动；冻结会消耗一次 */
    enemyCanAct(enemy) {
      if (enemy.frozen > 0) {
        enemy.frozen -= 1;
        return false;
      }
      return true;
    },

    /** 回合开始结算持续伤害与状态倒计时，返回事件文本 */
    tickStatus(enemy) {
      const out = [];
      if (enemy.dot && enemy.dot.turns > 0) {
        enemy.hp = Math.max(0, enemy.hp - enemy.dot.dmg);
        out.push(`感电　-${enemy.dot.dmg}`);
        enemy.dot.turns -= 1;
        if (enemy.dot.turns <= 0) enemy.dot = null;
      }
      if (enemy.atkDown > 0) enemy.atkDown -= 1;
      if (enemy.defDown > 0) enemy.defDown -= 1;
      return out;
    },

    /** 敌人面板上要显示的状态小标签 */
    statusLabels(enemy) {
      const out = [];
      if (enemy.frozen > 0) out.push('冻结');
      if (enemy.dot && enemy.dot.turns > 0) out.push('感电');
      if (enemy.atkDown > 0) out.push('破防');
      if (enemy.defDown > 0) out.push('降防');
      return out;
    },

    /** BOSS 阶段推进：血量跌破阈值就变身，返回本次进入的阶段列表 */
    advancePhase(enemy) {
      const applied = [];
      if (!enemy.phases) return applied;
      const ratio = enemy.hp / enemy.maxHp;
      while ((enemy.phaseIdx || 0) < enemy.phases.length) {
        const p = enemy.phases[enemy.phaseIdx];
        if (ratio > p.at) break;
        enemy.phaseIdx = (enemy.phaseIdx || 0) + 1;
        enemy.atk = Math.round(enemy.atk * p.atkMul);
        if (p.move) enemy.moves.push(p.move);
        enemy.phaseName = ' · ' + p.name;
        applied.push(p);
      }
      return applied;
    },

    /** 技能能否使用 */
    canUse(skill, actor) {
      if (skill.kind === 'q') return actor.energy >= skill.cost;
      if (skill.kind === 'e') return (actor.cd[skill.id] || 0) <= 0;
      return true;
    },

    spend(skill, actor) {
      if (skill.kind === 'q') {
        actor.energy = 0;
      } else if (skill.kind === 'e') {
        actor.cd[skill.id] = skill.cd;
        actor.energy = Math.min(actor.maxEnergy, actor.energy + (skill.energy || 0));
      } else {
        actor.energy = Math.min(actor.maxEnergy, actor.energy + (skill.energy || 0));
      }
    },

    tickCooldowns(actor) {
      for (const k in actor.cd) {
        if (actor.cd[k] > 0) actor.cd[k] = Math.max(0, actor.cd[k] - 1);
      }
    },
  };
})();
