  <script>
/**
 * battle.js —— 战斗界面与回合流程
 * 菜单 → 选技能 → 结算 → 敌方回合 → 回到菜单
 */
(function () {
  'use strict';
  const G = (window.G = window.G || {});

  const PANEL = (26, 22, 30);
  const BORDER = (243, 236, 222);
  const GOLD = (240, 215, 154);

  let bgGrad = null;

  const IMG = [
    { id: 'na', label: '普通攻击' },
    { id: 'e', label: '元素战技' },
    { id: 'q', label: '元素爆发' },
  ];

  G.battle = {
    active: false,
    phase: 'command',
    enemy: null,
    party: [],
    idx: 0,
    menu: 0,        // 主菜单：0 技能 1 换人 2 逃跑
    sub: 0,         // 技能子菜单
    log: [],
    timer: 0,
    t: 0,
    flash: 0,
    shake: 0,
    result: null,
  };

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /** 触屏点击：命中指令行或队伍格，返回 true 表示已处理 */
  G.battleTap = function (gx, gy) {
    const b = G.battle;
    if (!b || !b.active) return false;
    if (gy < 236 || gy > 266) return false;

    if (b.phase !== 'command') return false;

    // 技能子菜单：三格，每格 144 宽
    if (b.subMode === 'skill') {
      for (let i = 0; i < 3; i++) {
        const x = 16 + i * 152;
        if (gx >= x && gx <= x + 144) {
          if (b.sub === i) G.queueKey('action');
          else { b.sub = i; if (G.sfx) G.sfx.play('move'); }
          return true;
        }
      }
      return false;
    }

    // 道具子菜单：每格 108 宽
    if (b.subMode === 'item') {
      const list = (G.itemList ? G.itemList() : []) || [];
      const n = Math.max(1, Math.min(4, list.length));
      for (let i = 0; i < n; i++) {
        const x = 16 + i * 116;
        if (gx >= x && gx <= x + 108) {
          if (!list.length) { b.subMode = null; return true; }
          if (b.sub === i) G.queueKey('action');
          else { b.sub = i; if (G.sfx) G.sfx.play('move'); }
          return true;
        }
      }
      return false;
    }

    // 队伍格：换人（放在子菜单之后，否则会和第三个技能格重叠）
    for (let i = 0; i < b.party.length; i++) {
      const x = 330 + i * 34;
      if (gx >= x && gx <= x + 30) {
        if (i !== b.idx && b.party[i].hp > 0) {
          b.idx = i;
          if (G.sfx) G.sfx.play('confirm');
        }
        return true;
      }
    }

    // 指令行（5 个，与绘制保持一致：12 + i*62，宽 56）
    for (let i = 0; i < 5; i++) {
      const x = 12 + i * 62;
      if (gx >= x && gx <= x + 56) {
        if (b.menu === i) {
          G.queueKey('action');
        } else {
          b.menu = i;
          if (G.sfx) G.sfx.play('move');
        }
        return true;
      }
    }
    return false;
  };

  G.startBattle = function (enemyId) {
    const b = G.battle;
    b.active = true;
    b.phase = 'command';
    b.menu = 0;
    b.sub = 0;
    b.subMode = null;
    // 进战斗时清掉方向键：否则玩家边走边触发的战斗，菜单会被连发带着一直滚
    if (G.keys) {
      G.keys.left = G.keys.right = G.keys.up = G.keys.down = false;
      G.held = {};
      G.repeatT = {};
    }
    b.log = [];
    b.timer = 0;
    b.flash = 0;
    b.shake = 0;
    b.result = null;
    b.enemy = clone(G.ENEMY_DEF[enemyId]);
    b.enemy.hp = b.enemy.maxHp;
    b.enemy.aura = b.enemy.element;
    b.enemy.phaseIdx = 0;
    b.enemy.phaseName = '';
    b.xp = b.enemy.exp || 40;
    b.bonus = G.partyBonus ? G.partyBonus() : { energy: 0, burst: 0, def: 0, spd: 0, hp: 0, atk: 0, list: [] };
    b.fx = [];
    b.levelUp = [];
    b.enemyHpShown = 1;
    b.hitStop = 0;
    b.enemyKnock = 0;
    b.defer = null;
    b.anim = null;
    b.enemyFlash = 0;
    b.playerFlash = 0;
    b.party = G.PARTY_DEF.map((d) => {
      const c = clone(d);
      const prog = G.save ? G.save.of(d.id) : { lv: 1, exp: 0 };
      c.lv = prog.lv;
      const gs = G.gearApply ? G.gearApply(d) : { atk: d.atk, maxHp: d.maxHp };
      const bo = b.bonus;
      c.maxHp = G.scaleStat(gs.maxHp * (1 + (bo.hp || 0)), c.lv);
      c.atk = G.scaleStat(gs.atk * (1 + (bo.atk || 0)), c.lv);
      c.def = Math.round(d.def * (1 + (bo.def || 0)));
      c.gearName = (G.gearOf ? G.gearOf(d.id) : { name: '徒手' }).name;
      const saved = (G.progress.hp || {})[d.id];
      c.hp = (saved === undefined) ? c.maxHp : Math.max(1, Math.min(c.maxHp, saved));
      c.hpShown = c.hp / c.maxHp;
      c.energy = 0;
      c.cd = {};
      return c;
    });
    b.idx = 0;
    pushLog(`遭遇 ${b.enemy.name}！`);
  };

  // ---------- BOSS 阶段 ----------
  function advancePhase() {
    const b = G.battle;
    const list = G.BL.advancePhase(b.enemy);
    for (const p of list) {
      pushLog(`${b.enemy.name} ${p.name}！`);
      spawnText(336, 40, p.name, '#ff8a6a');
      spawnParticles(336, 96, '#b18cff', 26);
      b.shake = 0.3;
      b.flash = 0.2;
      if (G.sfx) G.sfx.play('react');
    }
  }

  // ---------- 特效 ----------
  function spawnText(x, y, text, color) {
    G.battle.fx.push({ k: 't', x, y, vy: -30, life: 1.0, max: 1.0, text, color });
  }

  function spawnParticles(x, y, color, n) {
    const c = color || '#fff';
    for (let i = 0; i < (n || 10); i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 40 + Math.random() * 70;
      G.battle.fx.push({
        k: 'p', x, y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30,
        life: 0.45 + Math.random() * 0.3, max: 0.75, color: c,
      });
    }
  }

  function updateFx(dt) {
    const b = G.battle;
    for (const f of b.fx) {
      f.life -= dt;
      if (f.k === 't') {
        f.y += f.vy * dt;
        f.vy *= 0.94;
      } else {
        f.x += f.vx * dt;
        f.y += f.vy * dt;
        f.vy += 180 * dt;
      }
    }
    b.fx = b.fx.filter((f) => f.life > 0);
  }

  function drawFx(ctx) {
    const b = G.battle;
    for (const f of b.fx) {
      const a = Math.max(0, Math.min(1, f.life / f.max));
      if (f.k === 't') {
        ctx.globalAlpha = a;
        ctx.font = 'bold 13px "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#1a1620';
        ctx.fillText(f.text, f.x + 1, f.y + 1);
        ctx.fillStyle = f.color || '#fff';
        ctx.fillText(f.text, f.x, f.y);
        ctx.textAlign = 'left';
        ctx.globalAlpha = 1;
      } else {
        ctx.globalAlpha = a;
        ctx.fillStyle = f.color;
        ctx.fillRect(Math.round(f.x), Math.round(f.y), 2, 2);
        ctx.globalAlpha = 1;
      }
    }
  }

  function pushLog(s) {
    const b = G.battle;
    b.log.push(s);
    if (b.log.length > 3) b.log.shift();
  }

  const cur = () => G.battle.party[G.battle.idx];
  const aliveIdx = () => G.battle.party.map((c, i) => (c.hp > 0 ? i : -1)).filter((i) => i >= 0);

  function nextAlive() {
    const b = G.battle;
    for (let k = 1; k <= b.party.length; k++) {
      const i = (b.idx + k) % b.party.length;
      if (b.party[i].hp > 0) return i;
    }
    return b.idx;
  }

  // ---------- 回合 ----------
  function playerAct(skillId) {
    const b = G.battle;
    const actor = cur();
    const skill = actor.skills.find((s) => s.id === skillId);
    if (!skill || !G.BL.canUse(skill, actor)) return false;

    let use = skill;
    if (skill.kind === 'q' && b.bonus && b.bonus.burst) {
      use = Object.assign({}, skill, { power: skill.power * (1 + b.bonus.burst) });
    }
    const res = G.BL.hit({ skill: use, attacker: actor, enemy: b.enemy });
    G.BL.spend(skill, actor);
    if (b.bonus && b.bonus.energy && skill.energy) {
      actor.energy = Math.min(actor.maxEnergy,
        actor.energy + Math.round(skill.energy * b.bonus.energy));
    }
    // 行动后回能（八重神子的「杀生樱」特征）
    const trE = (G.traitOf && G.traitOf(actor.id)) || {};
    if (trE.energy) {
      actor.energy = Math.min(actor.maxEnergy, actor.energy + trE.energy);
    }
    G.BL.tickCooldowns(actor);

    b.flash = 0.12;
    b.shake = 0.12;
    b.anim = { who: 'p', t: 0, dur: 0.34 };
    b.enemyFlash = 0.16;
    // 反应或高伤害时卡一帧，比单纯闪白更有「打到了」的感觉
    b.hitStop = (res.react ? 0.10 : res.dmg > 200 ? 0.07 : 0.03);
    pushLog(`${actor.name} · ${skill.name}　-${res.dmg}`);

    // 反馈延后到挥砍接触那一刻，而不是按下按钮就炸
    const elemC = (G.ELEM[skill.element || actor.element] || {}).c || '#f3ecde';
    b.defer = {
      t: 0.16, dmg: res.dmg, react: res.react, statusText: res.statusText,
      color: elemC, big: skill.kind !== 'na',
    };

    advancePhase();

    if (b.enemy.hp <= 0) {
      winBattle();
      return true;
    }
    b.phase = 'enemy';
    b.timer = 0.42;
    return true;
  }

  /** 把当前血量写回存档，下一场接着用 */
  G.saveBattleHp = function () {
    const b = G.battle;
    if (!b || !b.party) return;
    G.progress.hp = G.progress.hp || {};
    // 打完一场回一点血：不然连着打两场就必死
    const heal = b.result === 'win' ? 0.50 : 0;
    let healedTotal = 0;
    for (const c of b.party) {
      const after = Math.min(c.maxHp, c.hp + c.maxHp * heal);
      healedTotal += Math.round(after - c.hp);
      G.progress.hp[c.id] = Math.max(1, Math.round(after));
      c.hp = after;
    }
    b.healed = healedTotal;
  };

  function winBattle() {
    const b = G.battle;
    b.phase = 'win';
    b.result = 'win';
    G.saveBattleHp();
    pushLog(`${b.enemy.name} 被击倒了。`);
    if (G.save) {
      for (const c of b.party) {
        const before = (G.progress.party[c.id] || { lv: 1 });
        const oldHp = G.scaleStat(G.PARTY_DEF.find((x) => x.id === c.id).maxHp, before.lv);
        const oldAtk = G.scaleStat(G.PARTY_DEF.find((x) => x.id === c.id).atk, before.lv);
        const r = G.save.gainExp(c.id, b.xp);
        if (r.levels > 0) {
          const base = G.PARTY_DEF.find((x) => x.id === c.id);
          const newHp = G.scaleStat(base.maxHp, r.lv);
          const newAtk = G.scaleStat(base.atk, r.lv);
          b.levelUp.push(`${c.name} Lv.${before.lv} → Lv.${r.lv}`);
          pushLog(`${c.name} 升到 Lv.${r.lv}！HP +${newHp - oldHp}　ATK +${newAtk - oldAtk}`);
          b.levelGain = b.levelGain || [];
          b.levelGain.push({
            name: c.name,
            lv: r.lv,
            hp: newHp - oldHp,
            atk: newAtk - oldAtk,
            t: 2.6,
          });
        }
      }
      if (b.enemy.mora) G.save.addMora(b.enemy.mora);
      G.save.write();
    }
    if (G.sfx) G.sfx.play('win');
  }

  function enemyAct() {
    const b = G.battle;
    // 回合开始：持续伤害与状态倒计时
    const events = G.BL.tickStatus(b.enemy);
    if (events.length) {
      for (const t of events) pushLog(`${b.enemy.name}　${t}`);
      spawnText(336, 62, events[0], '#b18cff');
      spawnParticles(336, 96, '#b18cff', 8);
      advancePhase();
      if (b.enemy.hp <= 0) { winBattle(); return; }
    }
    if (!G.BL.enemyCanAct(b.enemy)) {
      pushLog(`${b.enemy.name} 被冻住了，动不了。`);
      spawnText(336, 56, '冻结', '#8fe3ff');
      b.phase = 'command';
      return;
    }

    const target = cur();
    // 有预警就打出预告的那一手，否则随机
    let move = null;
    if (b.telegraphMove) {
      move = b.telegraphMove;
      b.telegraphMove = null;
      b.telegraph = null;
    } else {
      const moves = b.enemy.moves;
      const lastGuarded = b.playerGuarded;
      const pierce = moves.filter((m) => m.pierce);
      if (b.enemy.persona === 'sly' && lastGuarded && pierce.length && Math.random() < 0.6) {
        move = pierce[Math.floor(Math.random() * pierce.length)];
        pushLog(`${b.enemy.name} 看穿了你的架势。`);
      } else {
        move = moves[Math.floor(Math.random() * moves.length)];
      }
    }
    b.playerGuarded = false;
    const guarding = target.guard > 0 && !move.pierce;
    // 残血狂怒：HP < 30% 时攻击 +25%
    let enrage = false;
    if (b.enemy.hp / b.enemy.maxHp < 0.30 && !b.enemy.enraged) {
      b.enemy.enraged = true;
      b.enemy.atk = Math.round(b.enemy.atk * 1.25);
      enrage = true;
    }
    if (enrage) pushLog(`${b.enemy.name} 狂暴了！攻击上升`);
    const res = G.BL.enemyHit({ move, enemy: b.enemy, target });
    if (target.guard > 0 && move.pierce) {
      pushLog('架势被破了！');
    }
    if (guarding && res && res.dmg > 0) {
      const cut = Math.max(1, Math.round(res.dmg * 0.5));
      target.hp = Math.min(target.maxHp, target.hp + (res.dmg - cut));
      res.dmg = cut;
    }
    target.guard = 0;
    b.shake = 0.16;
    b.flash = 0.08;
    b.anim = { who: 'e', t: 0, dur: 0.30 };
    b.playerFlash = 0.16;
    spawnText(108, 116, String(res.dmg), '#ff6b5e');
    spawnParticles(108, 140, '#c0392b', 8);
    pushLog(`${b.enemy.name} · ${move.name}　-${res.dmg}`);
    if (target.hp <= 0) {
      pushLog(`${target.name} 倒下了。`);
      const nx = nextAlive();
      if (b.party[nx].hp <= 0) {
        b.phase = 'lose';
        b.result = 'lose';
        return;
      }
      b.idx = nx;
    }
    b.phase = 'command';
  }

  // ---------- 输入 ----------
  G.battleUpdate = function (dt) {
    if (G.battle) G.battle.t = (G.battle.t || 0) + dt;
    const b = G.battle;
    if (!b.active) return;
    if (b.flash > 0) b.flash -= dt;
    // 血条缓动：数值先变，条在后面追
    const ease = 1 - Math.exp(-9 * dt);
    if (typeof b.enemyHpShown !== 'number') b.enemyHpShown = 1;
    b.enemyHpShown += (b.enemy.hp / b.enemy.maxHp - b.enemyHpShown) * ease;
    for (const c of b.party) {
      if (typeof c.hpShown !== 'number') c.hpShown = 1;
      c.hpShown += (c.hp / c.maxHp - c.hpShown) * ease;
    }

    if (b.defer) {
      b.defer.t -= dt;
      if (b.defer.t <= 0) {
        const d = b.defer;
        b.defer = null;
        // 浮动文字分车道：连续出手时不要全叠在一起
        b.lane = ((b.lane || 0) + 1) % 4;
        const laneY = 62 + b.lane * 9;
        const laneX = 336 + (b.lane % 2 === 0 ? -1 : 1) * (10 + b.lane * 4);
        spawnText(laneX, laneY, String(d.dmg), d.react ? '#ffd76a' : d.color);
        spawnParticles(336, 94, d.color, d.react ? 20 : 10);
        // 顿帧分档：轻击 2~3 帧，重击 5~8 帧，反应给最长的
        b.hitStop = d.react ? 0.10 : d.big ? 0.08 : 0.045;
        // 受击后退
        b.enemyKnock = d.react ? 14 : d.big ? 11 : 6;
        b.shake = Math.max(b.shake, d.big ? 0.14 : 0.08);
        if (d.statusText) pushLog(`　${d.statusText}`);
        if (d.react) {
          pushLog(`元素反应：${d.react.name}！`);
          spawnText(336, 30, d.react.name, '#ffd76a');
        }
      }
    }

    if (b.levelGain) {
      for (const g of b.levelGain) g.t -= dt;
      b.levelGain = b.levelGain.filter((g) => g.t > -0.4);
    }

    if (b.enemyKnock > 0) b.enemyKnock = Math.max(0, b.enemyKnock - dt * 60);

    if (b.hitStop > 0) {
      b.hitStop -= dt;
      return;
    }

    if (b.shake > 0) b.shake -= dt;
    if (b.enemyFlash > 0) b.enemyFlash -= dt;
    if (b.playerFlash > 0) b.playerFlash -= dt;
    if (b.anim) {
      b.anim.t += dt;
      if (b.anim.t >= b.anim.dur) b.anim = null;
    }
    updateFx(dt);

    if (b.phase === 'enemy') {
      // 下一手要是大招，提前一回合举牌
      if (!b.telegraphed && b.enemy && b.enemy.hp > 0 && b.enemy.moves) {
        const big = b.enemy.moves.filter((m) => (m.power || 0) >= 1.8);
        if (big.length && Math.random() < 0.55) {
          const pick = big[Math.floor(Math.random() * big.length)];
          b.telegraphMove = pick;
          b.telegraph = pick.name || '大招';
          b.telegraphed = true;
          pushLog(`▲ ${b.enemy.name} 在蓄力… 下一击是「${b.telegraph}」`);
        }
      }
      b.timer -= dt;
      if (b.timer <= 0) enemyAct();
      return;
    }
    if (b.phase === 'win' || b.phase === 'lose') {
      if (G.pressed.action) {
        b.active = false;
        if (b.result === 'win') G.onBattleWin && G.onBattleWin();
        else G.onBattleLose && G.onBattleLose();
      }
      return;
    }
    if (b.phase !== 'command') return;

    // 主菜单横向移动（4 项：技能 / 道具 / 换人 / 逃跑）
    // 子菜单开着时不要动主菜单，否则底层选中项会跟着乱跳
    const MENU_N = 4;
    if (!b.subMode && (G.pressed.left || G.pressed.right)) {
      const d = G.pressed.left ? -1 : 1;
      b.menu = (b.menu + d + MENU_N) % MENU_N;
      if (G.sfx) G.sfx.play('move');
    }
    // 技能子菜单
    if (b.subMode === 'skill') {
      // 子菜单是横排的，左右键当然也要能选
      if (G.pressed.left) b.sub = (b.sub + 2) % 3;
      if (G.pressed.right) b.sub = (b.sub + 1) % 3;
      if (G.pressed.up) b.sub = (b.sub + 2) % 3;
      if (G.pressed.down) b.sub = (b.sub + 1) % 3;
      if (G.pressed.cancel) { b.subMode = null; if (G.sfx) G.sfx.play('cancel'); }
      // 空格键或 Esc 都能退回主菜单
      if (G.pressed.action) {
        const id = IMG[b.sub].id;
        const sk = cur().skills.find((s) => s.id === id);
        if (sk && G.BL.canUse(sk, cur())) {
          b.subMode = null;
          playerAct(id);
        } else if (G.sfx) G.sfx.play('cancel');
      }
      return;
    }
    // 道具子菜单
    if (b.subMode === 'item') {
      const list = G.itemListUsable ? G.itemListUsable() : G.itemList();
      const n = Math.max(1, Math.min(4, list.length));
      if (G.pressed.left || G.pressed.up) b.sub = (b.sub + n - 1) % n;
      if (G.pressed.right || G.pressed.down) b.sub = (b.sub + 1) % n;
      if (G.pressed.cancel) { b.subMode = null; if (G.sfx) G.sfx.play('cancel'); }
      if (G.pressed.action && !list.length) {
        b.subMode = null;
        if (G.sfx) G.sfx.play('cancel');
        return;
      }
      if (G.pressed.action && list.length) {
        const it = list[Math.min(b.sub, list.length - 1)];
        const actor = cur();
        if (G.itemUse(it.id, actor)) {
          if (G.sfx) G.sfx.play('heal');
          spawnText(108, 116, `+${it.def.heal || 0}`, '#8fd35a');
          pushLog(`${actor.name} 使用了 ${it.def.name}`);
          b.subMode = null;
          b.phase = 'enemy';
          b.timer = 0.5;
        } else if (G.sfx) G.sfx.play('cancel');
      }
      return;
    }
    if (G.pressed.action) {
      if (G.sfx) G.sfx.play('confirm');
      if (b.menu === 0) {
        b.subMode = 'skill';
        b.sub = 0;
      } else if (b.menu === 1) {
        b.subMode = 'item';
        b.sub = 0;
      } else if (b.menu === 2) {
        // 防御：本回合减伤一半，回能，清一个负面
        const a = cur();
        b.playerGuarded = true;
        a.guard = 1;
        a.energy = Math.min(a.maxEnergy, a.energy + 15);
        const st = a.status || {};
        let cleared = '';
        if (st.freeze) { delete st.freeze; cleared = '冻结'; }
        else if (st.stun) { delete st.stun; cleared = '眩晕'; }
        pushLog(`${a.name} 摆出架势` + (cleared ? `，${cleared}解除` : '') + '（本回合减伤）');
        if (G.sfx) G.sfx.play('confirm');
        b.phase = 'enemy';
        b.timer = 0.36;
      } else if (b.menu === 3) {
        const nx = nextAlive();
        if (nx !== b.idx) {
          b.idx = nx;
          pushLog(`切换至 ${cur().name}`);
          b.phase = 'enemy';
          b.timer = 0.36;
        }
      } else {
        G.saveBattleHp();
        b.active = false;
        G.onBattleFlee && G.onBattleFlee();
      }
    }
  };

  // ---------- 绘制 ----------
  function bar(ctx, x, y, w, h, ratio, color, back) {
    ctx.fillStyle = back || 'rgba(20,18,24,0.85)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color;
    ctx.fillRect(x, y, Math.max(0, Math.round(w * Math.max(0, Math.min(1, ratio)))), h);
    ctx.strokeStyle = 'rgba(243,236,222,0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  }

  function panel(ctx, x, y, w, h) {
    ctx.fillStyle = 'rgba(22,20,26,0.94)';
    G.roundRect(ctx, x, y, w, h, 4);
    ctx.fill();
    ctx.strokeStyle = BORDER;
    ctx.lineWidth = 1;
    G.roundRect(ctx, x + 0.5, y + 0.5, w - 1, h - 1, 4);
    ctx.stroke();
  }

  function drawEnemy(ctx, e, x, y) {
    const c1 = `rgb(${e.color.join(',')})`;
    const c2 = `rgb(${e.color2.join(',')})`;
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    ctx.ellipse(x, y + 30, 34, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    if (e.id === 'slime_water') {
      ctx.fillStyle = c1;
      ctx.beginPath();
      ctx.ellipse(x, y, 30, 26, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = c2;
      ctx.beginPath();
      ctx.ellipse(x - 8, y - 8, 12, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1a1a22';
      ctx.fillRect(x - 10, y - 2, 4, 6);
      ctx.fillRect(x + 6, y - 2, 4, 6);
    } else {
      ctx.fillStyle = c1;
      ctx.beginPath();
      ctx.ellipse(x, y, 32, 22, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = c2;
      ctx.beginPath();
      ctx.moveTo(x - 18, y - 16);
      ctx.lineTo(x - 26, y - 34);
      ctx.lineTo(x - 8, y - 22);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + 18, y - 16);
      ctx.lineTo(x + 26, y - 34);
      ctx.lineTo(x + 8, y - 22);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#f0d465';
      ctx.fillRect(x - 10, y - 6, 5, 4);
      ctx.fillRect(x + 6, y - 6, 5, 4);
    }
    if (e.aura) {
      const col = (G.ELEM[e.aura] || {}).c || '#fff';
      ctx.strokeStyle = col;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, 36, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // ---------- 战斗背景 ----------
  // 每个地区一套配色 + 一个远景剪影，烘成 canvas 只做一次
  const BACKDROPS = {
    path:   { sky: ['#241f33', '#151220'], far: '#1b1826', mid: '#221d2e', accent: '#f0a8c8', motif: 'torii' },
    shrine: { sky: ['#1e1a33', '#120f1c'], far: '#191430', mid: '#221a38', accent: '#9fb0e8', motif: 'shrine' },
    town:   { sky: ['#2a2028', '#171218'], far: '#241a22', mid: '#2e2028', accent: '#f0c070', motif: 'roof' },
    depths: { sky: ['#101828', '#0a0e18'], far: '#0f1626', mid: '#16203a', accent: '#6fb0e0', motif: 'pillar' },
  };
  const backdropCache = {};
  let petalSeed = null;

  function buildBackdrop(key) {
    const d = BACKDROPS[key] || BACKDROPS.path;
    const W = G.VIEW_W, H = G.VIEW_H;
    const c = document.createElement('canvas');
    c.width = W;
    c.height = H;
    const g = c.getContext('2d');

    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, d.sky[0]);
    grad.addColorStop(1, d.sky[1]);
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);

    const glow = g.createRadialGradient(W / 2, H * 0.42, 10, W / 2, H * 0.42, W * 0.62);
    glow.addColorStop(0, 'rgba(120,140,200,0.16)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = glow;
    g.fillRect(0, 0, W, H);

    g.fillStyle = d.far;
    if (d.motif === 'torii') {
      for (let i = 0; i < 3; i++) {
        const x = 60 + i * 150, y = H * 0.30 + i * 10, w = 46, h = 62;
        g.fillRect(x, y, 6, h);
        g.fillRect(x + w - 6, y, 6, h);
        g.fillRect(x - 6, y, w + 12, 6);
        g.fillRect(x + 4, y + 14, w - 8, 4);
      }
    } else if (d.motif === 'shrine') {
      const cx = W / 2, y = H * 0.22;
      // 上檐（窄）
      g.beginPath();
      g.moveTo(cx - 74, y + 20);
      g.lineTo(cx - 44, y);
      g.lineTo(cx + 44, y);
      g.lineTo(cx + 74, y + 20);
      g.closePath();
      g.fill();
      // 下檐（宽，带起翘）
      g.beginPath();
      g.moveTo(cx - 124, y + 52);
      g.quadraticCurveTo(cx - 96, y + 30, cx - 70, y + 24);
      g.lineTo(cx + 70, y + 24);
      g.quadraticCurveTo(cx + 96, y + 30, cx + 124, y + 52);
      g.lineTo(cx + 118, y + 58);
      g.lineTo(cx - 118, y + 58);
      g.closePath();
      g.fill();
      // 柱
      for (let i = -2; i <= 2; i++) {
        g.fillRect(cx + i * 34 - 4, y + 58, 9, 54);
      }
      g.fillRect(cx - 96, y + 58, 192, 7);
      // 殿前石灯笼 + 暖光
      for (const lx of [cx - 86, cx + 86]) {
        const lg = g.createRadialGradient(lx, y + 74, 2, lx, y + 74, 34);
        lg.addColorStop(0, 'rgba(255,200,130,0.34)');
        lg.addColorStop(1, 'rgba(255,200,130,0)');
        g.fillStyle = lg;
        g.fillRect(lx - 34, y + 40, 68, 68);
        g.fillStyle = d.far;
        g.fillRect(lx - 5, y + 66, 11, 26);
        g.fillRect(lx - 9, y + 60, 19, 7);
      }
    } else if (d.motif === 'roof') {
      for (let i = 0; i < 5; i++) {
        const x = i * 100 - 20, y = H * 0.30 + (i % 2) * 12, w = 78, h = 40;
        g.fillRect(x, y + h, w, H);
        g.beginPath();
        g.moveTo(x - 8, y + h);
        g.lineTo(x + w / 2, y);
        g.lineTo(x + w + 8, y + h);
        g.closePath();
        g.fill();
      }
    } else {
      for (let i = 0; i < 6; i++) {
        const x = 30 + i * 76, w = 18 + (i % 3) * 6;
        g.fillRect(x, H * 0.20 + (i % 4) * 14, w, H);
      }
    }

    g.fillStyle = d.mid;
    g.globalAlpha = 0.85;
    g.fillRect(0, H * 0.62, W, H * 0.38);
    g.globalAlpha = 1;
    g.fillStyle = 'rgba(0,0,0,0.35)';
    g.fillRect(0, H * 0.70, W, 2);

    return c;
  }

  function drawBattleBackdrop(ctx, b) {
    const key = G.currentMap || 'path';
    if (!backdropCache[key]) backdropCache[key] = buildBackdrop(key);
    const d = BACKDROPS[key] || BACKDROPS.path;
    ctx.drawImage(backdropCache[key], 0, 0);

    const t = (b.t || 0);
    if (!petalSeed) {
      petalSeed = [];
      for (let i = 0; i < 26; i++) {
        petalSeed.push({
          x: Math.random() * G.VIEW_W,
          y: Math.random() * G.VIEW_H,
          s: 0.4 + Math.random() * 0.9,
          r: Math.random() * 6.28,
        });
      }
    }
    for (const p of petalSeed) {
      const y = (p.y + t * 14 * p.s) % G.VIEW_H;
      const x = p.x + Math.sin(t * 0.7 + p.r) * 9;
      ctx.fillStyle = d.accent;
      ctx.globalAlpha = 0.20 + 0.18 * p.s;
      ctx.fillRect(x, y, 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  /** 敌人蓄力时的视觉警告：红色感叹号 + 招式名 */
  function drawTelegraph(ctx) {
    const b = G.battle;
    if (!b || !b.telegraph) return;
    const t = b.t || 0;
    const k = 0.5 + 0.5 * Math.sin(t * 7);
    // 敌人位置（和绘制那边保持一致：右侧 336 附近，抬到头顶）
    const x = 336, y = 54;
    ctx.save();
    ctx.globalAlpha = 0.55 + 0.45 * k;
    // 底
    ctx.fillStyle = 'rgba(120,30,30,0.92)';
    G.roundRect(ctx, x - 54, y - 14, 108, 20, 4);
    ctx.fill();
    ctx.strokeStyle = `rgba(255,120,100,${(0.5 + 0.5 * k).toFixed(2)})`;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.font = 'bold 10px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#ffd0c4';
    ctx.fillText('！' + b.telegraph, x, y);
    ctx.textAlign = 'left';
    ctx.restore();
  }

  G.drawBattle = function (ctx) {
    const b = G.battle;
    if (!b.active) return;

    // 背景：按地图分层（远景烘一次，之后只贴图）
    drawBattleBackdrop(ctx, b);

    ctx.save();
    if (b.shake > 0) {
      ctx.translate((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4);
    }

    // 突进位移
    let eOff = 0, pOff = 0;
    if (b.anim) {
      const k = Math.sin((b.anim.t / b.anim.dur) * Math.PI);
      if (b.anim.who === 'p') pOff = k * 26;
      else eOff = -k * 24;
    }

    // 敌人
    ctx.save();
    if (b.enemyFlash > 0) ctx.globalAlpha = 0.55;
    drawEnemy(ctx, b.enemy, 336 + eOff + (b.enemyKnock || 0), 96 + Math.sin(performance.now() / 600) * 1.5);
    ctx.restore();

    // 我方角色（放大 2 倍）
    const actor = cur();
    const img = G.assets.chars;
    if (img) {
      const sx = (3 * 2) * 16;   // 朝右（第 4 个方向）
      const sy = actor.sprite * 32;
      ctx.save();
      if (b.playerFlash > 0) ctx.globalAlpha = 0.55;
      ctx.drawImage(img, sx, sy, 16, 32, 92 + pOff, 138, 32, 64);
      ctx.restore();
    }

    if (b.flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${Math.min(0.5, b.flash * 2)})`;
      ctx.fillRect(0, 0, G.VIEW_W, G.VIEW_H);
    }
    ctx.restore();

    drawTelegraph(ctx);
    drawFx(ctx);

    // 升级提示：面板上方浮一块，2.6 秒淡出
    if (b.levelGain && b.levelGain.length) {
      let gy = 96;
      for (const g of b.levelGain) {
        if (g.t <= 0) continue;
        const a = Math.min(1, g.t / 0.6);
        ctx.globalAlpha = a;
        ctx.fillStyle = 'rgba(28,24,34,0.94)';
        G.roundRect(ctx, 150, gy - 14, 180, 34, 4);
        ctx.fill();
        ctx.strokeStyle = 'rgba(240,215,154,0.85)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = '#ffd98a';
        ctx.font = 'bold 11px "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(g.name + '  Lv.' + g.lv, 240, gy - 1);
        ctx.font = '10px "Microsoft YaHei", sans-serif';
        ctx.fillStyle = '#8fd35a';
        ctx.fillText('HP +' + g.hp + '  ATK +' + g.atk, 240, gy + 13);
        ctx.textAlign = 'left';
        ctx.globalAlpha = 1;
        gy += 40;
      }
    }

    // 敌人信息
    panel(ctx, 10, 10, 168, 44);
    ctx.font = 'bold 11px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = BORDER;
    ctx.fillText(b.enemy.name + (b.enemy.phaseName || ''), 18, 26);
    ctx.font = '10px "Microsoft YaHei", sans-serif';
    if (b.enemy.element) {
      ctx.fillStyle = (G.ELEM[b.enemy.element] || {}).c || '#ccc';
      ctx.fillText(b.enemy.element, 18, 48);
    }
    const eGhost = Math.max(b.enemyHpShown, b.enemy.hp / b.enemy.maxHp);
    bar(ctx, 40, 40, 128, 6, eGhost, 'rgba(240,150,140,0.55)', 'transparent');
    bar(ctx, 40, 40, 128, 6, b.enemy.hp / b.enemy.maxHp, '#c0392b', 'transparent');
    // 状态标签
    const labels = G.BL.statusLabels(b.enemy);
    if (labels.length) {
      ctx.font = '10px "Microsoft YaHei", sans-serif';
      let lx = 10;
      for (const s of labels) {
        const w = ctx.measureText(s).width + 8;
        ctx.fillStyle = 'rgba(90,60,120,0.85)';
        G.roundRect(ctx, lx, 58, w, 11, 2);
        ctx.fill();
        ctx.fillStyle = '#e0d0ff';
        ctx.fillText(s, lx + 4, 66);
        lx += w + 3;
      }
    }
    ctx.fillStyle = 'rgba(243,236,222,0.75)';
    ctx.font = '10px "Microsoft YaHei", sans-serif';
    ctx.fillText(`${b.enemy.hp}/${b.enemy.maxHp}`, 118, 26);

    // 我方信息（带立绘）
    panel(ctx, 268, 168, 202, 50);
    const portrait = G.assets.portraits && G.assets.portraits[actor.portrait];
    if (portrait) {
      const pw = 30, ph = 42;
      const px = 272, py = 172;
      // 源图 2:3，按高度取宽度，居中裁，避免被拉宽
      const srcW = Math.min(portrait.width, Math.round(portrait.height * pw / ph));
      const sx = Math.round((portrait.width - srcW) / 2);
      ctx.fillStyle = 'rgba(16,14,20,0.95)';
      ctx.fillRect(px, py, pw, ph);
      ctx.drawImage(portrait, sx, 0, srcW, portrait.height, px, py, pw, ph);
      // 边框：优先用服装色，否则用元素色
      const ofr = (G.outfitOf && G.outfitOf(actor.id)) || null;
      const elemC = (G.ELEM[actor.element] || {}).c;
      ctx.strokeStyle = ofr ? ofr.color : (elemC || 'rgba(243,236,222,0.55)');
      ctx.lineWidth = 1;
      ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
    }
    const tx = portrait ? 312 : 276;
    const tw = portrait ? 150 : 186;
    ctx.font = 'bold 10px "Microsoft YaHei", sans-serif';
    // 名字用当前服装的配色
    const of = (G.outfitOf && G.outfitOf(actor.id)) || null;
    ctx.fillStyle = of ? of.color : BORDER;
    ctx.fillText(actor.name, tx, 182);
    ctx.font = '10px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = GOLD;
    ctx.fillText(`Lv.${actor.lv}`, tx + 56, 182);
    ctx.fillStyle = (G.ELEM[actor.element] || {}).c || '#ccc';
    ctx.fillText(actor.element, tx + 90, 182);
    const aGhost = Math.max(actor.hpShown || 1, actor.hp / actor.maxHp);
    bar(ctx, tx, 186, tw, 6, aGhost, 'rgba(235,120,110,0.5)', 'transparent');
    bar(ctx, tx, 186, tw, 6, actor.hp / actor.maxHp, '#3fa06a', 'transparent');
    bar(ctx, tx, 198, tw, 5, actor.energy / actor.maxEnergy, '#c9a227');
    ctx.fillStyle = 'rgba(243,236,222,0.6)';
    ctx.fillText(`HP ${actor.hp}/${actor.maxHp}`, tx, 214);
    ctx.fillText(`能量 ${Math.floor(actor.energy)}/${actor.maxEnergy}`, tx + 84, 214);
    if (actor.shield > 0) {
      ctx.fillStyle = '#8fe3ff';
      ctx.fillText(`护盾 ${actor.shield}`, 430, 194);
    }

    // 指令区
    panel(ctx, 8, 224, 464, 40);
    ctx.font = '10px "Microsoft YaHei", sans-serif';
    if (b.subMode) {
      ctx.fillStyle = 'rgba(240,215,154,0.9)';
      ctx.fillText(G.isTouch ? '点一下使用　点「返回」退出' : '← → 选择　空格 使用　Esc 返回', 16, 236);
    } else if (b.log.length) {
      ctx.fillStyle = 'rgba(200,192,180,0.9)';
      ctx.fillText(b.log[b.log.length - 1], 16, 236);
    }

    if (b.phase === 'command') {
      if (b.subMode === 'skill') {
        for (let i = 0; i < 3; i++) {
          const s = actor.skills.find((x) => x.id === IMG[i].id) || null;
          const x = 16 + i * 152;
          const sel = i === b.sub;
          ctx.fillStyle = sel ? 'rgba(122,59,52,0.95)' : 'rgba(44,40,52,0.9)';
          G.roundRect(ctx, x, 242, 144, 18, 3);
          ctx.fill();
          ctx.strokeStyle = sel ? GOLD : 'rgba(243,236,222,0.25)';
          ctx.stroke();
          ctx.fillStyle = sel ? '#fff' : 'rgba(220,212,200,0.8)';
          ctx.font = '10px "Microsoft YaHei", sans-serif';
          if (!s) { ctx.fillText('—', x + 6, 254); continue; }
          let tag = '';
          if (s.kind === 'q') {
            tag = actor.energy >= s.cost ? ` ${s.cost}` : ` 需${s.cost}能量`;
          } else if (s.kind === 'e') {
            tag = (actor.cd[s.id] || 0) > 0 ? ` 冷却${actor.cd[s.id]}` : '';
          }
          const usable = G.BL.canUse(s, actor);
          ctx.globalAlpha = usable ? 1 : 0.4;
          ctx.fillText(s.name.slice(0, 9) + tag, x + 5, 254);
          ctx.globalAlpha = 1;
        }
      } else if (b.subMode === 'item') {
        const list = G.itemListUsable ? G.itemListUsable() : G.itemList();
        if (!list.length) {
          ctx.fillStyle = 'rgba(220,212,200,0.7)';
          ctx.font = '10px "Microsoft YaHei", sans-serif';
          ctx.fillText('背包是空的。', 16, 254);
        }
        for (let i = 0; i < Math.min(4, list.length); i++) {
          const it = list[i];
          const x = 16 + i * 116;
          const sel = i === b.sub;
          ctx.fillStyle = sel ? 'rgba(122,59,52,0.95)' : 'rgba(44,40,52,0.9)';
          G.roundRect(ctx, x, 242, 108, 18, 3);
          ctx.fill();
          ctx.strokeStyle = sel ? GOLD : 'rgba(243,236,222,0.25)';
          ctx.stroke();
          ctx.fillStyle = it.def.color || '#fff';
          ctx.fillRect(x + 6, 249, 4, 4);
          ctx.fillStyle = sel ? '#fff' : 'rgba(220,212,200,0.8)';
          ctx.font = '10px "Microsoft YaHei", sans-serif';
          ctx.fillText(`${it.def.name}×${it.n}`, x + 14, 254);
        }
      } else {
        const items = ['技能', '道具', '防御', '换人', '逃跑'];
        for (let i = 0; i < 5; i++) {

        for (let i = 0; i < b.party.length; i++) {
          const c = b.party[i];
          const x = 330 + i * 34;
          ctx.fillStyle = c.hp > 0 ? 'rgba(60,54,66,0.95)' : 'rgba(40,34,40,0.7)';

          ctx.fillRect(x + 10, 245, 10, 6);
          ctx.globalAlpha = 1;
          bar(ctx, x + 4, 253, 22, 3, Math.max(c.hpShown || 1, c.hp / c.maxHp), 'rgba(235,120,110,0.45)', 'transparent');
          bar(ctx, x + 4, 253, 22, 3, c.hp / c.maxHp, '#3fa06a', 'transparent');

    }

    if (b.phase === 'win') {
      ctx.fillStyle = 'rgba(10,8,14,0.7)';
      ctx.fillRect(0, 0, G.VIEW_W, G.VIEW_H);
      ctx.fillStyle = GOLD;
      ctx.font = 'bold 20px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';

      ctx.font = '10px "Microsoft YaHei", sans-serif';
      ctx.fillStyle = BORDER;
      ctx.fillText(`获得经验 ${b.xp}　摩拉 ${b.enemy.mora || 0}`, G.VIEW_W / 2, 130);
      if (b.levelUp && b.levelUp.length) {
        ctx.fillStyle = GOLD;

      if (b.healed > 0) {

      ctx.fillText(G.isTouch ? '点屏幕继续' : '按空格继续', G.VIEW_W / 2, 180);
      ctx.textAlign = 'left';
    } else if (b.phase === 'lose') {
      ctx.fillStyle = 'rgba(10,8,14,0.78)';
      ctx.fillRect(0, 0, G.VIEW_W, G.VIEW_H);
      ctx.fillStyle = '#c0392b';
      ctx.font = 'bold 20px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('全 员 倒 下', G.VIEW_W / 2, 120);
      ctx.font = '10px "Microsoft YaHei", sans-serif';
      ctx.fillStyle = BORDER;
      ctx.fillText(G.isTouch ? '点屏幕回到参道' : '按空格回到参道', G.VIEW_W / 2, 146);
      ctx.textAlign = 'left';
    }
  };

/**

 */
(function () {

  let gearIdx = 0;

  let showParty = false;
  let partyIdx = 0;

  let miniKey = '';

  let shopIdx = 0;
  let showAch = false;
  let achT = 0;
  let clock = 0;
  G.fade = 0;
  G.fadeDir = -1;
  G.pendingMap = null;

  // ---------- 进度 ----------
  function refreshParty() {
    if (G.applyFormation) G.applyFormation();

    G.fieldSpeedMul = 1 + (b.spd || 0);
  }

  function applyProgress() {
    G.flags = G.progress.flags || {};
    G.inv = G.progress.inv || {};
    if (Object.keys(G.inv).length === 0 && !G.progress.battles) {
      G.inv = { tofu: 2, salve: 1 };   // 初始补给
    }
    G.gear = G.progress.gear || { owned: [], equip: {}, lv: {} };
    if (!G.gear.lv) G.gear.lv = {};
    G.progress.mora = G.progress.mora || 0;
    if (G.progress.formation && G.progress.formation.length) G.formation = G.progress.formation;
    refreshParty();
  }

  function loadSlot(i) {
    if (!G.save.load(i)) return false;
    applyProgress();
    const mk = G.progress.mapKey && G.MAPS[G.progress.mapKey] ? G.progress.mapKey : 'path';
    G.loadMap(mk, G.progress.player || null);
    introT = 2.0;

  }

  function writeProgress() {
    G.progress.flags = G.flags;
    G.progress.inv = G.inv;
    G.progress.mapKey = G.currentMap;
    G.progress.gear = G.gear;
    G.progress.formation = G.formation;
    G.progress.player = { x: G.player.x, y: G.player.y, dir: G.player.dir };
    G.save.write();
  }

  // ---------- 启动 ----------
  function showBootError(e) {
    const msg = String((e && e.message) || e);
    console.error('[雷樱纪] 启动异常:', e);
    const st = document.getElementById('ld-status');
    if (st) st.textContent = '启动失败：' + msg;
    document.title = 'ERR: ' + msg;
  }

  async function boot() {
   try {
    const canvas = document.getElementById('game');
    G.initCanvas(canvas);
    G.bindInput();
    G.bindTouch();
    // 战斗里点画面 = 点指令面板
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const gx = (e.clientX - rect.left) / (G.scale || 1);
      const gy = (e.clientY - rect.top) / (G.scale || 1);
      if (G.battle && G.battle.active && G.battleTap) G.battleTap(gx, gy);
    });
    G.onLoadProgress = (done, total, name) => {
      const fill = document.getElementById('ld-fill');
      const st = document.getElementById('ld-status');
      const pct = Math.round((done / total) * 100);
      if (fill) fill.style.width = pct + '%';
      if (st) st.textContent = `正在载入 ${pct}%` + (name ? `　${name}` : '');
    };
    await G.loadAll();
    const st0 = document.getElementById('ld-status');
    if (st0) st0.textContent = '准备就绪';

    // 任何一步失败都不能让加载页卡死
    try {
      G.initWorld();
    } catch (e) {
      console.error('[雷樱纪] 初始化世界失败', e);
    }
    // 调试/拍摄入口：?scene=ending 直接看终章
    // 拍摄入口：?map=shrine 直接落到指定地图
    const mm = /[?&]map=(path|shrine|town|depths)/.exec(location.search);
    if (mm && G.MAPS[mm[1]]) {
      G.progress.mapKey = mm[1];
      G.progress.player = null;
    }

    // 调试/拍摄入口：?scene=dialogue 直接开一段对话
    if (/[?&]scene=dialogue/.test(location.search)) {
      setTimeout(() => {
        const npc = { name: '八重神子', portrait: 'miko',
          lines: [
            '「你来晚了。」',
            '「风里有铁锈味——山那边又不太平了。」',
            '「去参道尽头看看。别一个人逞强，带上她们。」',
          ] };
        G.startDialogue(npc);
      }, 300);
    }

    // 调试/拍摄入口：?panel=inv|gear|party|quest 直接开面板
    const pm = /[?&]panel=(\w+)/.exec(location.search);
    if (pm) {
      setTimeout(() => {
        if (pm[1] === 'inv') showInv = true;
        if (pm[1] === 'gear') showGear = true;
        if (pm[1] === 'party') showParty = true;
        if (pm[1] === 'quest') showQuest = true;
        if (pm[1] === 'save') showSave = true;
        if (pm[1] === 'shop') showShop = true;
        if (pm[1] === 'ach') showAch = true;
        if (pm[1] === 'map') showMap = true;
        if (pm[1] === 'perf') G.perf.on = true;
        if (pm[1] === 'weather') {
          const wm = /[?&]w=(rain|snow|clear)/.exec(location.search);
          if (wm && G.env) { G.env.weather = wm[1]; G.env.weatherT = 1e9; G.env.t = 0.5;
            if (G.resetDrops) G.resetDrops(); }
        }
      }, 300);
    }

    // 调试/拍摄入口：?scene=battle 直接进战斗
    if (/[?&]scene=battle/.test(location.search)) {
      G.startBattle('slime_water');
    }

    if (/[?&]scene=ending/.test(location.search)) {
      G.startEnding();
      const m = /[?&]slide=(\d+)/.exec(location.search);
      if (m) {
        G.ending.slide = Number(m[1]);
        G.ending.revealed = 260;
        G.ending.fade = 0;
      }
    }

    // 后面这几步任何一步抛错，都必须把加载页收掉，否则玩家永远卡在黑屏
    try {
      G.save.load();
      if (G.isTouch && !G.progress.seen_tutorial) showTutorial = true;
      if (G.progress.outfit && G.outfit !== undefined) G.outfit = G.progress.outfit;
      applyProgress();
      const mapKey = G.progress.mapKey && G.MAPS[G.progress.mapKey] ? G.progress.mapKey : 'path';
      G.loadMap(mapKey, G.progress.player || null);
    } catch (e) {
      console.error('[雷樱纪] 启动失败，回退到初始状态', e);
      try {
        G.progress = G.progress || {};
        G.loadMap('path', null);
      } catch (e2) {
        console.error('[雷樱纪] 连回退都失败', e2);
      }
    }

    document.getElementById('loading').style.display = 'none';
    canvas.style.visibility = 'visible';
    started = true;
    introT = 2.4;
    last = performance.now();
    requestAnimationFrame(loop);
   } catch (e) {
     showBootError(e);
   }
  }

  // ---------- 更新 ----------
  function update(dt) {
    clock += dt;
    if (G.env) G.updateEnv(dt);
    if (typeof maybeBanter === 'function') maybeBanter(dt);

    // fade 双向：fadeDir = 1 压黑，压满时执行排队的地图切换，然后淡出
    if (G.fadeDir === 1) {
      G.fade = Math.min(1, G.fade + dt * 3.6);
      if (G.fade >= 1 && G.pendingMap) {
        const pm = G.pendingMap;
        G.pendingMap = null;
        G.loadMap(pm.to, pm.entry);
        introT = 2.0;

        G.fade = 1;
        G.fadeDir = -1;
      }
    } else if (G.fade > 0) {
      G.fade = Math.max(0, G.fade - dt * 3.2);
    }

    if (G.ending && G.ending.active) { G.updateEnding(dt); return; }

    // 章节过场：条件满足就自动播一段
    if (G.checkCutscene && !G.dialogue.active && G.fade <= 0.05) G.checkCutscene();

    if (G.battle && G.battle.active) {
      G.battleUpdate(dt);
      return;
    }

    if (showInv) {
      if (G.pressed.cancel || G.pressed.inventory) {
        showInv = false;
        G.sfx.play('cancel');
      }
      return;
    }

    if (G.pressed.mute) {
      const m = G.sfx.toggle();
      G.toast = { text: m ? '静音' : '取消静音', t: 1.2 };
      return;
    }

    if (showShop) {
      if (G.pressed.up) { shopIdx = (shopIdx + G.SHOP.length - 1) % G.SHOP.length; G.sfx.play('move'); }
      if (G.pressed.down) { shopIdx = (shopIdx + 1) % G.SHOP.length; G.sfx.play('move'); }
      if (G.pressed.action) {
        const r = G.shopBuy(shopIdx);
        if (r === 'ok') { G.sfx.play('levelup'); G.toast = { text: '买下了', t: 1.2 }; writeProgress(); }
        else if (r === 'poor') { G.sfx.play('cancel'); G.toast = { text: '摩拉不够', t: 1.2 }; }
        else if (r === 'owned') { G.sfx.play('cancel'); G.toast = { text: '已经有一把了', t: 1.2 }; }
      }
      if (G.pressed.cancel) { showShop = false; G.sfx.play('cancel'); }
      return;
    }

    if (showAch) {
      if (G.pressed.cancel || G.pressed.achpanel) { showAch = false; G.sfx.play('cancel'); }
      return;
    }

    if (G.pressed.achpanel) { showAch = true; G.sfx.play('confirm'); return; }

    if (showParty) {
      const n = G.ROSTER.length;
      if (G.pressed.up) { partyIdx = (partyIdx + n - 1) % n; G.sfx.play('move'); }
      if (G.pressed.down) { partyIdx = (partyIdx + 1) % n; G.sfx.play('move'); }
      if (G.pressed.action) {
        const r = G.toggleFormation(G.ROSTER[partyIdx].id);
        if (r === 'full') { G.sfx.play('cancel'); G.toast = { text: '队伍已满（4 人）', t: 1.2 }; }
        else if (r === 'last') { G.sfx.play('cancel'); G.toast = { text: '至少留一个人', t: 1.2 }; }
        else { refreshParty(); writeProgress(); G.sfx.play('confirm'); }
      }
      if (G.pressed.cancel || G.pressed.partypanel) { showParty = false; G.sfx.play('cancel'); }
      return;
    }

    // 换装：队伍面板里换选中的，面板外换第一个（手机上也能用）
    if (G.pressed.outfit && !(G.battle && G.battle.active)) {
      const who = G.ROSTER[showParty ? partyIdx : 0];
      if (who && G.outfitCycle) {
        const of = G.outfitCycle(who.id, 1);
        if (of) G.toast = { text: who.name + ' 换上「' + of.name + '」', t: 1.6 };
        G.sfx.play('confirm');
      }
      return;
    }
    if (showTutorial) {
      if (G.pressed.action || G.pressed.cancel || (G.tapQueue && G.tapQueue.length)) {
        showTutorial = false;
        G.progress.seen_tutorial = true;
        writeProgress();
        G.sfx.play('confirm');
      }
      return;
    }
    if (G.pressed.bigmap) {
      showMap = !showMap;
      G.sfx.play(showMap ? 'confirm' : 'cancel');
      return;
    }
    if (showMap) {
      if (G.pressed.cancel) { showMap = false; G.sfx.play('cancel'); }
      return;
    }
    if (G.pressed.partypanel) { showParty = true; G.sfx.play('confirm'); return; }

    if (showQuest) {
      if (G.pressed.cancel || G.pressed.questlog) { showQuest = false; G.sfx.play('cancel'); }
      return;
    }

    if (G.pressed.questlog) { showQuest = true; G.sfx.play('confirm'); return; }

    if (G.pressed.perf) { G.perf.on = !G.perf.on; G.sfx.play('confirm'); return; }

    if (G.pressed.minimap) {
      miniOn = !miniOn;
      G.sfx.play('confirm');
      return;
    }

    if (showSave) {
      if (G.pressed.up) { saveIdx = (saveIdx + 2) % 3; G.sfx.play('move'); }
      if (G.pressed.down) { saveIdx = (saveIdx + 1) % 3; G.sfx.play('move'); }
      if (G.pressed.action) {
        writeProgress();
        G.save.write(saveIdx);
        G.sfx.play('levelup');
        G.toast = { text: `已保存到槽位 ${saveIdx + 1}`, t: 1.6 };
      }
      if (G.pressed.loadslot) {
        if (loadSlot(saveIdx)) {
          G.sfx.play('portal');
          G.toast = { text: `已读取槽位 ${saveIdx + 1}`, t: 1.6 };
        } else {
          G.sfx.play('cancel');
          G.toast = { text: '这个槽位是空的', t: 1.4 };
        }
      }
      if (G.pressed.cancel || G.pressed.savepanel) { showSave = false; G.sfx.play('cancel'); }
      return;
    }

    if (G.pressed.savepanel) { showSave = true; saveIdx = G.currentSlot; G.sfx.play('confirm'); return; }

    if (showGear) {
      const n = G.PARTY_DEF.length;
      if (G.pressed.up) { gearIdx = (gearIdx + n - 1) % n; G.sfx.play('move'); }
      if (G.pressed.down) { gearIdx = (gearIdx + 1) % n; G.sfx.play('move'); }
      if (G.pressed.left || G.pressed.right) {
        const id = G.PARTY_DEF[gearIdx].id;
        G.gearCycle(id, G.pressed.left ? -1 : 1);
        G.sfx.play('confirm');
        writeProgress();
      }
      if (G.pressed.action) {
        const id = G.gear.equip[G.PARTY_DEF[gearIdx].id] || 'none';
        const r = G.gearUpgrade(id);
        if (r === 'ok') { G.sfx.play('levelup'); G.toast = { text: '强化成功', t: 1.2 }; writeProgress(); }
        else if (r === 'poor') { G.sfx.play('cancel'); G.toast = { text: '摩拉不够', t: 1.2 }; }
        else if (r === 'max') { G.sfx.play('cancel'); G.toast = { text: '已经满级', t: 1.2 }; }
        else { G.sfx.play('cancel'); }
      }
      if (G.pressed.cancel || G.pressed.gear) { showGear = false; G.sfx.play('cancel'); }
      return;
    }

    if (G.pressed.gear) {
      showGear = true;
      G.sfx.play('confirm');
      return;
    }

    if (G.pressed.inventory) {
      showInv = true;
      G.sfx.play('confirm');
      return;
    }

    const talking = G.dialogue.active;
    G.updatePlayer(dt);
    G.dialogueUpdate(dt);

    if (!talking && !G.dialogue.active && G.pressed.action) {
      const n = G.nearestNPC();
      if (n) {
        if (n.shop) { showShop = true; shopIdx = 0; G.sfx.play('confirm'); }
        else G.startDialogue(n);
      }
    }

    // 野怪
    if (!G.dialogue.active) {
      for (const e of G.ENCOUNTERS) {
        if (!e.alive) continue;
        if (Math.hypot(e.x - G.player.x, e.y - G.player.y) < 22) {
          G.battle.encounter = e;
          G.startBattle(e.id);
          G.sfx.play('confirm');
          return;
        }
      }
    }

    // 地面道具
    for (let i = 0; i < G.PICKUPS.length; i++) {
      const p = G.PICKUPS[i];
      if (p.taken) continue;
      if (Math.hypot(p.x - G.player.x, p.y - G.player.y) < 16) {
        p.taken = true;
        let label = '';
        if (p.gear) {
          G.gearAdd(p.gear);
          label = G.GEAR_DEF[p.gear].name;
        } else {
          G.itemAdd(p.item, 1);
          label = G.ITEMS[p.item].name;
        }
        if (p.flag) G.flagSet(p.flag);
        G.sfx.play('pickup');
        G.toast = { text: `获得 ${label}`, t: 1.6 };
        G.progress.pickups = G.progress.pickups || {};
        G.progress.pickups[G.currentMap + ':' + i] = true;
        writeProgress();
      }
    }

    // 传送门（已经在过场里就不再触发，否则 fade 会被反复重置）
    if (G.pendingMap) return;
    for (const pt of G.PORTALS) {
      if (Math.hypot(pt.x - G.player.x, pt.y - G.player.y) < pt.r) {
        G.sfx.play('portal');
        if (pt.to === 'shrine') G.flagSet('entered_shrine');
        if (pt.to === 'town') G.flagSet('reached_town');
        if (pt.to === 'depths') G.flagSet('entered_depths');
        // 先压黑再切图，避免硬跳
        G.pendingMap = { to: pt.to, entry: { x: pt.tx, y: pt.ty, dir: 1 } };
        G.fadeDir = 1;
        G.fade = 0.02;

    // NPC 朝向
    for (const n of G.NPCS) {
      if (G.dialogue.active && G.dialogue.npc === n) continue;
      const dx = G.player.x - n.x;
      const dy = G.player.y - n.y;
      if (Math.hypot(dx, dy) < 40) {
        n.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 3 : 2) : (dy > 0 ? 0 : 1);
      }
    }

    if (G.currentMap === 'path' && G.player.y < 10 * 16) G.flagSet('reached_torii');

    // 终章完成、且还没看过演出 → 自动开演
    if (G.flagHas('chapter3_done') && !G.progress.seen_ending && !G.dialogue.active) {
      G.startEnding();
      return;
    }

    // 相机朝面朝方向多看一点，走起来更「跟手」
    const LA = 14;
    const lx = G.player.dir === 3 ? LA : G.player.dir === 2 ? -LA : 0;
    const ly = G.player.dir === 0 ? LA : G.player.dir === 1 ? -LA : 0;
    G.updateCamera(G.player.x + lx, G.player.y - 8 + ly, dt);
    if (introT > 0) introT -= dt;
    if (G.toast) { G.toast.t -= dt; if (G.toast.t <= 0) G.toast = null; }

    achT += dt;
    if (achT > 1) {
      achT = 0;
      const fresh = G.achCheck();
      if (fresh.length) {

        let gain = 0;
        for (const a of fresh) gain += (a.mora || 0);
        const before = G.achCount();
        const allDone = before >= G.ACH.length;
        if (allDone) gain += (G.ACH_ALL_MORA || 0);
        G.progress.mora = (G.progress.mora || 0) + gain;
        const label = allDone
          ? `全成就达成！摩拉 +${gain}`
          : fresh.length === 1
            ? `成就解锁：${fresh[0].name}　摩拉 +${gain}`
            : `成就解锁 ×${fresh.length}（${fresh[0].name} 等）　摩拉 +${gain}`;
        G.toast = { text: label, t: 2.4 };
        if (G.sfx) G.sfx.play('levelup');

  // ---------- 绘制 ----------
  // ---------- 画面调色 ----------
  // 每个地区一个很淡的色调；再叠一层暗角把视线收到中间。
  // 缓存成 canvas，避免每帧重建渐变（480x270 上逐帧建渐变会掉帧）。
  const GRADE_TINT = {
    path:   'rgba(120,150,110,0.03)',
    shrine: 'rgba(150,120,180,0.05)',
    town:   'rgba(190,150,110,0.04)',
    depths: 'rgba(28,38,84,0.34)',
  };
  let vignetteCanvas = null;
  let gradeKey = '';

  function ensureVignette() {
    if (vignetteCanvas) return vignetteCanvas;
    const c = document.createElement('canvas');
    c.width = G.VIEW_W;
    c.height = G.VIEW_H;
    const g2 = c.getContext('2d');
    const grad = g2.createRadialGradient(
      G.VIEW_W / 2, G.VIEW_H / 2, G.VIEW_H * 0.35,
      G.VIEW_W / 2, G.VIEW_H / 2, G.VIEW_W * 0.72
    );
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(6,5,10,0.26)');
    g2.fillStyle = grad;
    g2.fillRect(0, 0, G.VIEW_W, G.VIEW_H);
    vignetteCanvas = c;
    return c;
  }

  function drawGrade(ctx) {
    const key = G.currentMap || 'path';
    if (key !== gradeKey) gradeKey = key;
    const tint = GRADE_TINT[key];
    if (tint) {
      ctx.fillStyle = tint;
      ctx.fillRect(0, 0, G.VIEW_W, G.VIEW_H);
    }
    const v = ensureVignette();
    if (v) ctx.drawImage(v, 0, 0);

  }

  // ---------- 面板越界检查（只在 ?audit=1 时启用） ----------
  // 面板绘制时把框设到 G.auditRect，超出框的绘制会被记下来。
  G.auditRect = null;
  G.auditHits = [];
  G.auditStart = function (ctx) {
    if (ctx.__audited) return;
    ctx.__audited = true;
    const wrap = (name, check) => {
      const orig = ctx[name].bind(ctx);
      ctx[name] = function (...args) {
        try { check(args); } catch (e) { /* 忽略 */ }
        return orig(...args);
      };
    };
    const rect = () => G.auditRect;
    const note = (what, x, y) => {
      const r = rect();
      if (!r) return;
      if (x < r.x - 2 || x > r.x + r.w + 2 || y < r.y - 14 || y > r.y + r.h + 2) {
        // 这两类不是越界：面板的全屏遮罩、HUD 底部键位提示
        const isDim = x <= 0 && y <= 0;
        const isHint = y >= 250;
        if (isDim || isHint) return;
        G.auditHits.push({ what, x: Math.round(x), y: Math.round(y) });
      }
    };
    wrap("fillText", (a) => note("text:" + String(a[0]).slice(0, 12), a[1], a[2]));
    wrap("fillRect", (a) => note("rect", a[0], a[1]));
    wrap("strokeRect", (a) => note("stroke", a[0], a[1]));
  };

      ctx.fill();
      ctx.strokeStyle = 'rgba(244,186,210,0.55)';
      ctx.lineWidth = 1;

      ctx.fillStyle = '#f4bad2';

    } else if (q) {

      const w = ctx.measureText(txt).width + 18;
      ctx.fillStyle = 'rgba(18,16,22,0.78)';

      ctx.fillStyle = 'rgba(18,16,22,0.85)';

  function drawShop(ctx) {
    ctx.fillStyle = 'rgba(10,8,14,0.85)';
    ctx.fillRect(0, 0, G.VIEW_W, G.VIEW_H);
    const x = 60, y = 32, w = 360, h = 200;
    G.auditRect = { x, y, w, h }; // 供越界检查用
    ctx.fillStyle = 'rgba(22,20,26,0.96)';
    G.roundRect(ctx, x, y, w, h, 4);
    ctx.fill();
    ctx.strokeStyle = '#f3ecde';
    G.roundRect(ctx, x + 0.5, y + 0.5, w - 1, h - 1, 4);
    ctx.stroke();

    ctx.fillStyle = '#f0d79a';
    ctx.font = 'bold 12px "Microsoft YaHei", sans-serif';
    ctx.fillText('杂货商', x + 16, y + 24);
    ctx.font = '10px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'right';
    ctx.fillStyle = '#f3ecde';
    ctx.fillText(`摩拉 ${G.progress.mora || 0}`, x + w - 16, y + 24);
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(200,192,180,0.7)';
    ctx.fillText('上下选择　确认购买　返回 关闭', x + 90, y + 24);

    // 窗口化：只画放得下的条数，否则会溢出面板
    const rowH = 21;
    const listTop = y + 50;
    const listBottom = y + h - 14;
    const maxRows = Math.max(3, Math.floor((listBottom - listTop) / rowH));
    let shopStart = 0;
    if (G.SHOP.length > maxRows) {
      shopStart = Math.min(Math.max(0, shopIdx - Math.floor(maxRows / 2)),
                           G.SHOP.length - maxRows);
    }
    const shopShown = G.SHOP.slice(shopStart, shopStart + maxRows);

    shopShown.forEach((it, k) => {
      const i = shopStart + k;
      const ly = listTop + k * rowH;
      const sel = i === shopIdx;
      const owned = it.kind === 'gear' && G.gear.owned.indexOf(it.id) >= 0;
      const afford = (G.progress.mora || 0) >= it.price;
      if (sel) {
        ctx.fillStyle = 'rgba(122,59,52,0.85)';
        G.roundRect(ctx, x + 10, ly - 12, w - 20, 19, 3);
        ctx.fill();
      }
      ctx.font = '10px "Microsoft YaHei", sans-serif';
      // 选中的一行永远提亮，否则暗底暗字看不清
      ctx.fillStyle = owned ? 'rgba(170,162,150,0.7)'
        : sel ? '#fff8e6'
          : afford ? '#f3ecde' : 'rgba(180,132,120,0.9)';
      ctx.fillText(G.shopLabel(it), x + 18, ly);
      ctx.textAlign = 'right';
      ctx.fillStyle = owned ? 'rgba(170,162,150,0.7)'
        : sel ? '#ffd98a'
          : afford ? '#f0d79a' : '#c06a5a';
      ctx.fillText(owned ? '已拥有' : `${it.price}`, x + w - 18, ly);
      ctx.textAlign = 'left';
    });

    // 还有多少条没显示
    const more = G.SHOP.length - maxRows;
    if (more > 0) {
      ctx.font = '10px "Microsoft YaHei", sans-serif';
      ctx.fillStyle = 'rgba(160,152,142,0.65)';
      if (shopStart > 0) {
        ctx.textAlign = 'right';
        ctx.fillText(`↑ 还有 ${shopStart} 条`, x + w - 18, y + 44);
        ctx.textAlign = 'left';
      }
      const left = G.SHOP.length - (shopStart + shopShown.length);
      if (left > 0) {
        ctx.textAlign = 'right';
        ctx.fillText(`↓ 还有 ${left} 条`, x + w - 18, y + h - 20);
        ctx.textAlign = 'left';
      }
    }
  }

    ctx.fill();
    ctx.strokeStyle = '#f3ecde';
    G.roundRect(ctx, x + 0.5, y + 0.5, w - 1, h - 1, 4);
    ctx.stroke();

    ctx.fillStyle = '#f0d79a';
    ctx.font = 'bold 12px "Microsoft YaHei", sans-serif';
    ctx.fillText('任务日志', x + 16, y + 22);
    ctx.font = '10px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(200,192,180,0.7)';
    ctx.fillText('Esc / 返回 关闭', x + w - 92, y + 22);

    // 支线：贴在面板底部，不占主线位置
    const side = G.sideCurrent ? G.sideCurrent() : null;
    if (side) {
      const sy = y + h - 34;
      ctx.fillStyle = 'rgba(150,190,230,0.9)';
      ctx.fillText(`支线 · ${side.side.text}`, x + 16, sy);
      ctx.fillStyle = 'rgba(200,192,180,0.75)';
      ctx.fillText(side.step.text, x + 92, sy);
    }

    // 只显示当前进度附近的几条，否则 14 条会顶出面板
    const cur = G.questCurrent();
    const rowH = 16;
    const top = y + 46;
    const limit = y + h - 26;
    const maxRows = Math.max(3, Math.floor((limit - top) / rowH) + 1);
    const curIdx = cur ? G.STEPS.findIndex((s) => s.id === cur.id) : G.STEPS.length - 1;
    let start = 0;
    if (G.STEPS.length > maxRows) {
      start = Math.min(Math.max(0, curIdx - Math.floor(maxRows / 2)), G.STEPS.length - maxRows);
    }
    const shown = G.STEPS.slice(start, start + maxRows);
    shown.forEach((s, i) => {
      const ly = top + i * rowH;
      const done = s.done(G.flags);
      const isCur = cur && cur.id === s.id;
      ctx.font = '10px "Microsoft YaHei", sans-serif';
      ctx.fillStyle = done ? '#8fd35a' : isCur ? '#f0d79a' : 'rgba(150,142,132,0.6)';
      ctx.fillText(done ? '✓' : isCur ? '▸' : '·', x + 18, ly);
      ctx.fillStyle = done ? 'rgba(200,192,180,0.55)' : isCur ? '#f3ecde' : 'rgba(150,142,132,0.6)';
      ctx.fillText(s.text, x + 32, ly);
    });
    ctx.font = '10px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(150,142,132,0.55)';
    if (start > 0) ctx.fillText(`↑ 还有 ${start} 条`, x + w - 74, top + 2);
    const rest = G.STEPS.length - start - shown.length;
    if (rest > 0) ctx.fillText(`↓ 还有 ${rest} 条`, x + w - 74, top + (shown.length - 1) * rowH);

    // 统计
    const stats = [
      `战斗 ${G.progress.battles || 0}`,
      `摩拉 ${G.progress.mora || 0}`,
      `完成 ${G.questDoneCount()} / ${G.STEPS.length}`,
    ];
    ctx.fillStyle = 'rgba(200,192,180,0.7)';
    ctx.font = '10px "Microsoft YaHei", sans-serif';
    ctx.fillText(stats.join('　　'), x + 16, y + h - 12);
  }

  function buildMini() {
    if (miniKey === G.currentMap && miniCache) return miniCache;
    const W = G.MAP_W, H = G.MAP_H, s = 2, T = G.TILE;
    const c = document.createElement('canvas');
    c.width = W * s;
    c.height = H * s;
    const g = c.getContext('2d');
    const COL = {};
    COL[T.GRASS] = '#3c6440'; COL[T.GRASS_FLOWER] = '#3c6440'; COL[T.GRASS_DARK] = '#37603c';
    COL[T.PATH] = '#8a8578'; COL[T.PATH_CRACK] = '#847f72';
    COL[T.PATH_L] = '#6f7a5c'; COL[T.PATH_R] = '#6f7a5c';
    COL[T.WATER] = '#2f5f80'; COL[T.WATER_B] = '#3a708f';
    COL[T.DIRT] = '#6b5238'; COL[T.CLIFF] = '#46424f';
    COL[T.BUSH] = '#2f5232'; COL[T.ROCK] = '#5a564e';
    COL[T.FLOWERBED] = '#4a6b45'; COL[T.SAND] = '#a89870'; COL[T.VOID] = '#141018';
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        g.fillStyle = COL[G.tileAt(x, y)] || '#3c6440';
        g.fillRect(x * s, y * s, s, s);
      }
    }
    miniCache = c;
    miniKey = G.currentMap;
    return c;
  }

  function drawMinimap(ctx) {
    if (!miniOn || !G.MAP_W) return;
    const img = buildMini();
    const x = G.VIEW_W - img.width - 8;
    const y = 30;
    ctx.fillStyle = 'rgba(12,10,16,0.75)';
    ctx.fillRect(x - 2, y - 2, img.width + 4, img.height + 4);
    ctx.drawImage(img, x, y);
    ctx.strokeStyle = 'rgba(240,215,154,0.45)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x - 1.5, y - 1.5, img.width + 3, img.height + 3);

    const px = x + (G.player.x / G.TILE_SIZE) * 2;
    const py = y + (G.player.y / G.TILE_SIZE) * 2;
    ctx.fillStyle = '#ff5a4a';
    ctx.fillRect(px - 1, py - 1, 3, 3);

    for (const n of G.NPCS) {
      ctx.fillStyle = '#f0d79a';
      ctx.fillRect(x + (n.x / G.TILE_SIZE) * 2, y + (n.y / G.TILE_SIZE) * 2, 2, 2);
    }
    for (const e of G.ENCOUNTERS) {
      if (!e.alive) continue;
      ctx.fillStyle = '#b18cff';
      ctx.fillRect(x + (e.x / G.TILE_SIZE) * 2, y + (e.y / G.TILE_SIZE) * 2, 2, 2);
    }
  }

  // ---------- 沿途议论 ----------
  // 每个角色几句随性的话，进新图时偶尔冒一句（不打断操作，走 toast）
  const BANTER = {
    ei: ['「这条路我走过很多次。」', '「风变了。」', '「别停下来。」'],
    miko: ['「将军大人，你走得太快了。」', '「这里的樱，开得不错。」', '「要歇一会儿吗？」'],
    ayaka: ['「雪还没化。」', '「兄长的信，我还没回。」', '「请小心脚下。」'],
    kazuha: ['「叶子和风，说的是同一件事。」', '「这地方我来过。」', '「听。」'],
    sara: ['「我在前面探路。」', '「有动静。」', '「天狗的耳朵，不会漏。」'],
    lumine: ['「……」（她在看别处）', '「这里安静得不太对。」', '「走吧。」'],
  };
  let lastBanterMap = '';
  let banterCd = 0;

  function maybeBanter(dt) {
    banterCd -= dt;
    if (banterCd > 0) return;
    const key = G.currentMap;
    if (key === lastBanterMap) return;
    lastBanterMap = key;
    banterCd = 24;                       // 24 秒内不再冒
    if (Math.random() > 0.45) return;    // 不是每次都说话
    const who = (G.formation && G.formation.length) ? G.formation[0] : 'ei';
    const list = BANTER[who];
    if (!list) return;
    const line = list[Math.floor(Math.random() * list.length)];
    const c = (G.ROSTER || []).find((r) => r.id === who);
    G.toast = { text: `${c ? c.name : ''}：${line}`, t: 2.6 };
  }

  const ACTOR_POOL = [];

  function drawTutorial(ctx) {
    ctx.fillStyle = 'rgba(8,7,12,0.88)';
    ctx.fillRect(0, 0, G.VIEW_W, G.VIEW_H);

  function drawBigMap(ctx) {
    ctx.fillStyle = 'rgba(8,7,12,0.88)';
    ctx.fillRect(0, 0, G.VIEW_W, G.VIEW_H);

    const src = G.world.staticCanvas;
    const title = (G.MAPS[G.currentMap] || {}).name || '地图';
    const x = 24, y = 34, w = G.VIEW_W - 48, h = G.VIEW_H - 76;
    G.auditRect = { x, y, w, h }; // 供越界检查用

    ctx.fillStyle = 'rgba(20,18,26,0.96)';
    G.roundRect(ctx, x - 8, y - 26, w + 16, h + 40, 4);
    ctx.fill();
    ctx.strokeStyle = 'rgba(243,236,222,0.5)';
    ctx.stroke();

    ctx.fillStyle = '#f0d79a';
    ctx.font = 'bold 11px "Microsoft YaHei", sans-serif';
    ctx.fillText('地图 · ' + title, x - 2, y - 10);
    ctx.font = '10px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(200,192,180,0.7)';
    ctx.textAlign = 'right';
    ctx.fillText('B / 返回 关闭', x + w - 6, y - 10);
    ctx.textAlign = 'left';

    if (!src) {
      ctx.fillStyle = 'rgba(200,192,180,0.6)';
      ctx.fillText('这张地图还没准备好', x, y + 20);
      return;
    }

    // 等比缩放塞进面板
    const sc = Math.min(w / src.width, h / src.height);
    const dw = Math.floor(src.width * sc);
    const dh = Math.floor(src.height * sc);
    const dx = x + Math.floor((w - dw) / 2);
    const dy = y + Math.floor((h - dh) / 2);

    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(src, 0, 0, src.width, src.height, dx, dy, dw, dh);
    ctx.strokeStyle = 'rgba(243,236,222,0.35)';
    ctx.strokeRect(dx - 0.5, dy - 0.5, dw + 1, dh + 1);

    const toMap = (wx, wy) => ({
      x: dx + (wx / (G.MAP_W * G.TILE_SIZE)) * dw,
      y: dy + (wy / (G.MAP_H * G.TILE_SIZE)) * dh,
    });

    // NPC（黄）
    for (const n of G.NPCS) {
      const p = toMap(n.x, n.y);
      ctx.fillStyle = '#f0d79a';
      ctx.fillRect(Math.round(p.x) - 1, Math.round(p.y) - 1, 3, 3);
    }
    // 敌人（紫）
    for (const e of G.ENCOUNTERS) {
      if (!e.alive) continue;
      const p = toMap(e.x, e.y);
      ctx.fillStyle = '#b18cff';
      ctx.fillRect(Math.round(p.x) - 1, Math.round(p.y) - 1, 2, 2);
    }
    // 任务目标门（闪一下）
    const goal = G.questGoalMap && G.questGoalMap();
    const portal = goal ? (G.PORTALS || []).find((pt) => pt.to === goal) : null;
    if (portal) {
      const p = toMap(portal.x, portal.y);
      const k = 0.5 + 0.5 * Math.sin(performance.now() / 260);
      ctx.strokeStyle = `rgba(240,215,154,${(0.5 + 0.5 * k).toFixed(2)})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4 + k * 2, 0, Math.PI * 2);
      ctx.stroke();
    }
    // 自己（红，带呼吸圈）
    const me = toMap(G.player.x, G.player.y);
    ctx.fillStyle = '#ff5a4a';
    ctx.fillRect(Math.round(me.x) - 2, Math.round(me.y) - 2, 4, 4);
    ctx.strokeStyle = 'rgba(255,90,74,0.75)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(me.x, me.y, 6, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawSave(ctx) {
    ctx.fillStyle = 'rgba(10,8,14,0.85)';
    ctx.fillRect(0, 0, G.VIEW_W, G.VIEW_H);
    const x = 60, y = 40, w = 360, h = 180;
    G.auditRect = { x, y, w, h }; // 供越界检查用
    ctx.fillStyle = 'rgba(22,20,26,0.96)';
    G.roundRect(ctx, x, y, w, h, 4);
    ctx.fill();
    ctx.strokeStyle = '#f3ecde';
    G.roundRect(ctx, x + 0.5, y + 0.5, w - 1, h - 1, 4);
    ctx.stroke();

    ctx.fillStyle = '#f0d79a';
    ctx.font = 'bold 12px "Microsoft YaHei", sans-serif';
    ctx.fillText('存 档', x + 16, y + 24);
    ctx.font = '10px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(200,192,180,0.7)';
    ctx.fillText('空格 保存　L 读取　返回 关闭', x + 190, y + 24);

    const slots = G.save.slots();
    slots.forEach((s, i) => {
      const ly = y + 52 + i * 38;
      const sel = i === saveIdx;
      if (sel) {
        ctx.fillStyle = 'rgba(122,59,52,0.5)';
        G.roundRect(ctx, x + 10, ly - 16, w - 20, 32, 3);
        ctx.fill();
      }
      ctx.font = '10px "Microsoft YaHei", sans-serif';
      ctx.fillStyle = '#f3ecde';
      ctx.fillText(`槽位 ${i + 1}`, x + 20, ly);
      ctx.font = '10px "Microsoft YaHei", sans-serif';
      if (!s.exists) {
        ctx.fillStyle = 'rgba(180,172,160,0.6)';
        ctx.fillText('—— 空 ——', x + 80, ly);
        return;
      }
      const when = s.stamp ? new Date(s.stamp).toLocaleString('zh-CN', { hour12: false }) : '';
      const chap = s.ch2 ? '第二章' : s.ch1 ? '第一章' : '序章';
      ctx.fillStyle = '#f0d79a';
      ctx.fillText(chap, x + 80, ly);
      ctx.fillStyle = 'rgba(200,192,180,0.85)';
      ctx.fillText(`战斗 ${s.battles}　摩拉 ${s.mora}`, x + 130, ly);
      ctx.fillStyle = 'rgba(160,152,142,0.7)';
      ctx.fillText(when, x + 80, ly + 11);
    });
  }

  function draw() {
    const ctx = G.ctx;
    G.auditRect = null;   // 每帧清空，避免面板框跨帧残留造成误报
    ctx.fillStyle = '#1a1a22';
    ctx.fillRect(0, 0, G.VIEW_W, G.VIEW_H);

    if (G.ending && G.ending.active) { G.drawEnding(ctx); return; }

    if (G.battle && G.battle.active) {
      G.drawBattle(ctx);
      return;
    }

    G.drawWorld(ctx, G.camera);

    G.drawDust(ctx, G.camera);

    // 复用同一个数组，避免每帧新建（移动端 GC 压力）
    const actors = ACTOR_POOL;
    actors.length = 0;
    for (const o of G.OBJECTS) actors.push({ y: o.y, kind: 'obj', ref: o });
    for (const n of G.NPCS) actors.push({ y: n.y, kind: 'npc', ref: n });
    for (const e of G.ENCOUNTERS) if (e.alive) actors.push({ y: e.y, kind: 'foe', ref: e });
    for (const p of G.PICKUPS) if (!p.taken) actors.push({ y: p.y, kind: 'pick', ref: p });
    actors.push({ y: G.player.y, kind: 'player' });
    actors.sort((a, b) => a.y - b.y);

    // 脚下阴影：敌人本来就有，玩家和 NPC 也补上，人才像站在地上
    function footShadow(wx, wy, w, h) {
      ctx.fillStyle = 'rgba(8,10,14,0.38)';
      ctx.beginPath();
      ctx.ellipse(Math.round(wx - G.camera.x), Math.round(wy - G.camera.y + 1), w, h, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const a of actors) {
      if (a.kind === 'player') {
        footShadow(G.player.x, G.player.y, 10, 3.5);
        G.drawPlayer(ctx, G.camera);
      } else if (a.kind === 'npc') {
        if (a.ref.kind !== 'cat') footShadow(a.ref.x, a.ref.y, 7, 3);
        const n = a.ref;
        if (n.kind === 'cat') G.drawCat(ctx, n.x, n.y, G.camera, clock);
        else G.drawChar(ctx, n.sprite, n.x, n.y, n.dir || 0, 0, G.camera);
      } else if (a.kind === 'foe') {
        const e = a.ref;
        const x = Math.round(e.x - G.camera.x);
        const y = Math.round(e.y - G.camera.y);
        const bob = Math.sin(clock * 2.4 + e.x) * 1.5;
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.ellipse(x, y, 10, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = e.c || '#4a8cbe';
        ctx.beginPath();
        ctx.ellipse(x, y - 8 + bob, 9, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = e.c2 || '#6cb0e0';
        ctx.beginPath();
        ctx.ellipse(x - 3, y - 11 + bob, 4, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1a1a22';
        ctx.fillRect(x - 4, y - 8 + bob, 2, 3);
        ctx.fillRect(x + 2, y - 8 + bob, 2, 3);
      } else if (a.kind === 'pick') {
        G.drawPickup(ctx, a.ref, G.camera, clock);
      } else {
        G.drawObject(ctx, a.ref, G.camera);
      }
    }

    if (!G.dialogue.active) {
      const n = G.nearestNPC();
      if (n) {
        const bx = Math.round(n.x - G.camera.x);
        const by = Math.round(n.y - 38 - G.camera.y);
        ctx.fillStyle = 'rgba(18,16,22,0.85)';
        G.roundRect(ctx, bx - 22, by - 2, 44, 13, 3);
        ctx.fill();
        ctx.fillStyle = '#f0d79a';
        ctx.font = '10px "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('空格 交谈', bx, by + 7);
        ctx.textAlign = 'left';
      }
    }

    // ---- 任务指引：目标门画脉冲环；不在画面内就在玩家身边画箭头 ----
    if (!G.battle.active && G.env && !(G.ending && G.ending.active)) {
      const goal = G.questGoalMap && G.questGoalMap();
      const portal = goal ? (G.PORTALS || []).find((p) => p.to === goal) : null;
      if (portal) {
        const t = performance.now() / 1000;
        const sx = Math.round(portal.x - G.camera.x);
        const sy = Math.round(portal.y - G.camera.y);
        const onScreen = sx > -20 && sx < G.VIEW_W + 20 && sy > -20 && sy < G.VIEW_H + 20;
        if (onScreen) {
          const r = 10 + Math.sin(t * 3) * 3;
          ctx.strokeStyle = 'rgba(240,215,154,0.85)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(sx, sy - 4, r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = 'rgba(240,215,154,0.9)';
          ctx.font = '10px "Microsoft YaHei", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('目标', sx, sy - 22);
          ctx.textAlign = 'left';
        } else {
          // 玩家身边画一个指向目标的箭头（离远一点，别压在人物身上）
          const px = Math.round(G.player.x - G.camera.x);
          const py = Math.round(G.player.y - G.camera.y);
          const ang = Math.atan2(portal.y - G.player.y, portal.x - G.player.x);
          const R = 34;
          const ax = px + Math.cos(ang) * R;
          const ay = py - 8 + Math.sin(ang) * R;
          ctx.save();
          ctx.translate(ax, ay);
          ctx.rotate(ang);
          ctx.fillStyle = 'rgba(240,215,154,0.95)';
          ctx.beginPath();
          ctx.moveTo(8, 0);
          ctx.lineTo(-5, -5);
          ctx.lineTo(-5, 5);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
          const dist = Math.round(Math.hypot(portal.x - G.player.x, portal.y - G.player.y) / 16);
          ctx.fillStyle = 'rgba(240,215,154,0.9)';
          ctx.font = '10px "Microsoft YaHei", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(dist + ' 步', ax, ay + 18);
          ctx.textAlign = 'left';
        }
      }
    }

    if (introT > 0) {
      const def = G.MAPS[G.currentMap];
      const a = Math.min(1, introT / 0.8);
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(18,16,22,0.75)';
      G.roundRect(ctx, G.VIEW_W / 2 - 80, 16, 160, 26, 4);
      ctx.fill();
      ctx.strokeStyle = 'rgba(240,215,154,0.6)';
      ctx.stroke();
      ctx.fillStyle = '#f0d79a';
      ctx.font = '11px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(def ? def.name : '', G.VIEW_W / 2, 33);
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }

    drawGrade(ctx);   // 区域色调 + 暗角（在 HUD 之下，不糊界面）
    G.drawEnv(ctx);
    drawHUD(ctx);
    G.drawClock(ctx);
    drawMinimap(ctx);
    G.drawDialogue(ctx);
    if (showTutorial) { drawTutorial(ctx); return; }
    if (showMap) drawBigMap(ctx);
    if (showInv) drawInventory(ctx);
    if (showGear) drawGear(ctx);
    if (showSave) drawSave(ctx);
    if (showParty) drawParty(ctx);
    if (showShop) drawShop(ctx);
    if (showAch) drawAch(ctx);
    if (showQuest) drawQuest(ctx);

    if (G.fade > 0) {
      ctx.fillStyle = `rgba(8,7,12,${G.fade})`;
      ctx.fillRect(0, 0, G.VIEW_W, G.VIEW_H);
    }

    if (G.perf && G.perf.on) {
      const txt = `${G.perf.fps} fps` + (G.perf.med ? `  ${G.perf.med}ms` : '') +
        (G.perf.worst ? ` 最慢${G.perf.worst}ms` : '') +
        (G.perf.hitch ? ` 卡${G.perf.hitch}` : '') +
        (G.perf.mem ? ` ${G.perf.mem}MB` : '');
      ctx.font = '10px Consolas, monospace';
      const tw2 = ctx.measureText(txt).width + 8;
      ctx.fillStyle = 'rgba(10,8,14,0.6)';
      ctx.fillRect(6, G.VIEW_H - 26, tw2, 12);
      ctx.fillStyle = G.perf.fps >= 55 ? '#8fd35a' : G.perf.fps >= 40 ? '#f0d79a' : '#e06a5a';
      ctx.fillText(txt, 10, G.VIEW_H - 17);
    }

    ctx.fillStyle = 'rgba(243,236,222,0.35)';
    ctx.font = '10px "Microsoft YaHei", sans-serif';
    // 手机上没有键盘，提示得说屏幕上的按钮
    const isTouch = G.isTouch;
    let hint;
    if (G.dialogue.active) {
      hint = isTouch ? '点「确认」继续　点「返回」关闭' : '空格 继续　返回 关闭';
    } else if (G.battle && G.battle.active) {
      hint = isTouch ? '点指令　点队友换人' : '方向键 选　空格 确认';
    } else {
      hint = isTouch
        ? '点方向键走　点「确认」交谈　「菜单」里有背包队伍存档'
        : '方向键 移动　空格 交谈　I 背包　G 装备　P 队伍　Q 任务　F 帧率';
    }
    if (isTouch) {
      // 手机版底部左右都是按钮，提示放中间才不被压住
      ctx.textAlign = 'center';
      ctx.fillText(hint, G.VIEW_W / 2, G.VIEW_H - 8);
      ctx.textAlign = 'left';
    } else {
      ctx.fillText(hint, 10, G.VIEW_H - 4);
    }
  }

  let errShown = '';
  function reportError(err) {
    const msg = String((err && err.message) || err);
    if (errShown !== msg) { errShown = msg; console.error('[雷樱纪]', err); }
    const ctx = G.ctx;
    if (!ctx) return;
    ctx.fillStyle = 'rgba(10,8,14,0.92)';
    ctx.fillRect(0, 0, G.VIEW_W, 42);
    ctx.fillStyle = '#e06a5a';
    ctx.font = '10px "Microsoft YaHei", sans-serif';
    ctx.fillText('运行出错：' + msg.slice(0, 42), 10, 18);
    ctx.fillStyle = '#f3ecde';
    ctx.font = '10px "Microsoft YaHei", sans-serif';
    ctx.fillText('按 Ctrl+F5 重载；详细堆栈见控制台', 10, 34);
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    if (G.perf) {
      G.perf.acc += dt;
      G.perf.n++;
      // 单帧耗时（用真实 now 差值，不低估）
      if (G.perf.prev) {
        const ms = now - G.perf.prev;
        if (ms > 0 && ms < 500) {
          G.perf.samples.push(ms);
          if (G.perf.samples.length > 30) G.perf.samples.shift();
          if (ms > 33) G.perf.hitch++;
        }
      }
      G.perf.prev = now;
      if (G.perf.acc >= 0.5) {
        G.perf.fps = Math.round(G.perf.n / G.perf.acc);
        G.perf.acc = 0;
        G.perf.n = 0;
        const s = G.perf.samples;
        if (s.length) {
          const sorted = s.slice().sort((a, b) => a - b);
          G.perf.med = Math.round(sorted[Math.floor(sorted.length / 2)] * 10) / 10;
          G.perf.worst = Math.round(sorted[sorted.length - 1] * 10) / 10;
        }
        try {
          if (window.performance && performance.memory) {
            G.perf.mem = Math.round(performance.memory.usedJSHeapSize / 1048576);
          }
        } catch (e) { /* 有的浏览器不给 */ }
      }
    }
    if (started) {
      // 战斗里方向键会压住日志，收起来；点击面板代替
      const tw = document.getElementById('touch');
      if (tw) tw.classList.toggle('insave', !!showSave);
      if (tw) tw.classList.toggle('inbattle', !!(G.battle && G.battle.active));
      if (tw) tw.classList.toggle('indialogue', !!(G.dialogue && G.dialogue.active));
      G.updateInput(dt);
      try {
        update(dt);
        draw();
      } catch (err) {
        reportError(err);
      }
    }
    G.endFrame();
    requestAnimationFrame(loop);
  }

  window.addEventListener('DOMContentLoaded', boot);

  // ---------- 战斗回调 ----------
  G.onBattleWin = function () {
    const e = G.battle.encounter;
    if (e) {
      e.alive = false;
      const idx = G.ENCOUNTERS.indexOf(e);
      if (idx >= 0) {
        G.progress.encounters = G.progress.encounters || {};
        G.progress.encounters[G.currentMap + ':' + idx] = true;
      }
      if (e.flag) G.flagSet(e.flag);
    }
    G.progress.battles = (G.progress.battles || 0) + 1;
    G.battle.encounter = null;
    writeProgress();
  };
  G.onBattleLose = function () {
    const sp = G.MAPS[G.currentMap].spawn;
    G.player.x = sp.x;
    G.player.y = sp.y;
    G.player.dir = 1;
    G.battle.encounter = null;
    writeProgress();
  };
  G.writeProgress = writeProgress;

  // 供离线自动演示 / 回归使用
  G.debugUpdate = update;
  G.debugDraw = draw;
  // 给自动化测试看面板开关状态（面板都是闭包变量，外面读不到）
  G.debugUI = function () {
    return {
      inv: showInv, gear: showGear, party: showParty, quest: showQuest,
      save: showSave, shop: showShop, ach: showAch,
      touch: !!G.isTouch, battle: !!(G.battle && G.battle.active),
      dialogue: !!(G.dialogue && G.dialogue.active),
    };
  };

  G.onBattleFlee = function () {
    G.player.y += 40;
    G.battle.encounter = null;
  };
})();

</script>
</body>
